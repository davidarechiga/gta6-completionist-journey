<title>GTA VI Spoiler-Free Exploration Companion</title>
<meta name="description" content="An unofficial, spoiler-light completionist companion for Grand Theft Auto VI: what to do next, why now, and what you'd miss by advancing the story.">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#161c1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400..800&display=swap">
<style>
/* Look: green-black ground, bone type, sea-glass accent, one Florida photograph per chapter.
   Second pass (2026-11-20) took out the common AI-template habits: no mono caps labels, no pill badges,
   no boxed cards for list rows, no letter-tile logo or progress ring, no photo faded into the page,
   no glass header, no hover lifts or staggered fade-ins. One family, Overpass: an open-source cut of
   Highway Gothic, the lettering on Florida's road signs. Layout: one column on phones (thumb tab bar),
   a two-column "now" board and header tabs on desktop. */
/* Overpass's middle dot sits off-centre; borrow a system one for that single character. */
@font-face { font-family: "Sep"; src: local("Helvetica Neue"), local("HelveticaNeue"), local("Arial"), local("Roboto"); unicode-range: U+00B7; }
:root {
  color-scheme: dark;
  --bg: #161c1a;
  --bg-deep: #111614;
  --surface: #1f2725;
  --surface-2: #26302d;
  --surface-3: #313c38;
  --line: rgba(227, 226, 218, 0.09);
  --line-strong: rgba(227, 226, 218, 0.18);
  --ink: #e3e2da;
  --ink-2: #c2c4bb;
  --ink-3: #a9afa7;
  --accent: #9fc7b8;
  --accent-hi: #b6d6ca;
  --accent-ink: #161c1a;
  --danger: #f0897a;
  --warn: #e4bf6e;
  --apricot: #eaa66f;
  --font: "Sep", "Overpass", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: var(--font);
  --font-body: var(--font);
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r-xl: 8px;
  --r-lg: 6px;
  --r-md: 6px;
  --r-sm: 4px;
  --r-btn: 6px;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --dur: 160ms;
  --tabbar-h: 64px;
  --topbar-h: 60px;
  /* names the script uses inline */
  --night: var(--bg);
  --night-2: var(--surface);
  --night-3: var(--surface-2);
  --night-4: var(--surface-3);
  --teal: var(--accent);
  --sun: var(--warn);
}
* { box-sizing: border-box; }
html { background: var(--bg); overflow-x: clip; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { color: var(--accent-hi); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
img { display: block; max-width: 100%; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--ink-3); }
.wrap {
  max-width: none; margin: 0 auto;
  padding-left: max(clamp(16px, 4.5vw, 88px), env(safe-area-inset-left, 0px));
  padding-right: max(clamp(16px, 4.5vw, 88px), env(safe-area-inset-right, 0px));
}

.skip { position: fixed; left: 12px; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 60; padding: 12px 16px; border-radius: 6px; background: var(--ink); color: var(--bg); font-weight: 700; text-decoration: none; transform: translateY(-160%); transition: transform var(--dur) var(--ease); }
.skip:focus, .skip:focus-visible { transform: none; color: var(--bg); }

/* ── Header ── */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.topbar-inner { display: flex; align-items: center; gap: 8px; min-height: var(--topbar-h); padding-block: 8px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1; }
.brand-text { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand-name { font-weight: 800; font-size: 17px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-size: 13px; font-weight: 500; color: var(--ink-3); white-space: nowrap; }
@media (max-width: 719px), (min-width: 900px) and (max-width: 1279px) { .brand-sub { display: none; } }
@media (max-width: 479px) { .brand-name { white-space: normal; font-size: 16px; line-height: 1.1; } }
.ring { display: flex; align-items: center; flex: none; padding: 0 8px; min-height: 44px; border: 0; border-radius: var(--r-btn); background: none; color: var(--ink); cursor: pointer; font-variant-numeric: tabular-nums; transition: background-color var(--dur) var(--ease); }
.ring b { font-weight: 800; font-size: 16px; }
.ring small { font-size: 13px; font-weight: 600; color: var(--ink-3); }
.icon-btn {
  width: 44px; height: 44px; border-radius: 6px; border: 0; background: transparent; display: grid; place-items: center; flex: none; color: var(--ink-2);
  transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.icon-btn svg { width: 20px; height: 20px; }
.desk-tabs { display: none; gap: 0; }

/* ── Tab bar ── */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: var(--bg-deep); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tabbar-inner { display: grid; grid-template-columns: repeat(6, 1fr); max-width: 760px; margin: 0 auto; }
.tab {
  height: var(--tabbar-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  background: none; border: 0; color: var(--ink-3); font-size: 12px; font-weight: 700; position: relative;
  transition: color var(--dur) var(--ease);
}
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] svg { color: var(--accent); }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: calc(50% - 14px); width: 28px; height: 3px; background: var(--accent); }
.tab .badge { position: absolute; top: 8px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #22100c; font-size: 11px; font-weight: 800; display: grid; place-items: center; line-height: 1; }
main { padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 28px); }

@media (min-width: 900px) {
  .tabbar { display: none; }
  .desk-tabs { display: flex; margin-right: 8px; }
  .desk-tabs .tab { height: var(--topbar-h); flex-direction: row; padding: 0 12px; font-size: 15px; gap: 8px; color: var(--ink-3); }
  .desk-tabs .tab svg { display: none; }
  .desk-tabs .tab:hover { color: var(--ink); }
  .desk-tabs .tab[aria-current="page"] { color: var(--ink); }
  .desk-tabs .tab[aria-current="page"]::before { display: none; }
  .desk-tabs .tab[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: var(--accent); }
  .desk-tabs .tab .badge { position: static; }
  main { padding-bottom: 56px; }
}

/* ── Generic bits ── */
.section { display: flex; flex-direction: column; gap: 12px; margin-top: 36px; }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.section-title { font-size: 20px; font-weight: 800; line-height: 1.2; }
.muted { color: var(--ink-3); }
.small { font-size: 14px; }
.btn {
  min-height: 44px; padding: 0 16px; border-radius: var(--r-btn); border: 1px solid transparent; background: var(--surface-2);
  font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; color: var(--ink);
  transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.btn svg { width: 18px; height: 18px; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: transparent; }
.btn-danger { border-color: color-mix(in srgb, var(--danger) 50%, transparent); color: var(--danger); background: transparent; }
.btn-sm { min-height: 40px; padding: 0 14px; font-size: 14px; }
@media (max-width: 899px) { .btn-sm { min-height: 44px; } }
@media (hover: hover) {
  .btn:hover { background: var(--surface-3); }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
  .btn-primary:hover { background: var(--accent-hi); }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-danger:hover { background: color-mix(in srgb, var(--danger) 10%, transparent); border-color: var(--danger); }
}
.btn:active, .icon-btn:active { transform: scale(.98); }

/* Tags: plain coloured words, not pills. Colour only where it means something (missable, timed, essential). */
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 14px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 13.5px; font-weight: 600; line-height: 1.4; color: var(--ink-3); white-space: nowrap; }
.chip svg { width: 14px; height: 14px; flex: none; }
.chip .dot { display: none; }
.chip.p-essential { color: var(--apricot); }
.chip.p-recommended { color: var(--ink-2); }
.chip.miss { color: var(--danger); }
.chip.f-gunfight { color: var(--warn); }
.chip.f-possible { color: var(--ink-2); }
.chip.timed { color: var(--warn); }
.chip.teaser { color: var(--ink-2); }
.chip.teaser svg { color: var(--accent); }
.chip.teaser.plain { color: var(--ink-3); }
.chip.st-deferred { color: var(--warn); }
.chip.st-missed { color: var(--danger); }
.verif { display: inline-flex; align-items: center; gap: 5px; font-size: 13.5px; font-weight: 600; color: var(--ink-3); }
.verif svg { width: 14px; height: 14px; }
.verif.v-verified { color: var(--accent); }
.verif.v-community { color: var(--warn); }
.verif.v-unconfirmed { color: var(--ink-3); }

/* ── Rows (a checklist, not a stack of cards) ── */
.list { display: flex; flex-direction: column; }
.list > article:first-of-type { border-top: 1px solid var(--line); }
.card { position: relative; border-bottom: 1px solid var(--line); transition: background-color var(--dur) var(--ease); }
.card.is-open { background: var(--surface); border-bottom-color: transparent; border-radius: var(--r-md); margin: 4px 0; }
@media (hover: hover) { .card:not(.is-open):hover { background: color-mix(in srgb, var(--surface) 55%, transparent); } }
.card-row { display: grid; grid-template-columns: 48px minmax(0, 1fr); align-items: start; }
.check {
  width: 44px; height: 44px; margin: 8px 0 8px 2px; border: 0; background: none; position: relative;
  display: grid; place-items: center; color: transparent; transition: color .15s;
}
.check::before {
  content: ""; position: absolute; inset: 12px; border: 2px solid var(--line-strong); border-radius: 4px;
  transition: background-color .15s, border-color .15s;
}
.check svg { width: 14px; height: 14px; position: relative; }
@media (hover: hover) { .card:not(.s-done) .check:hover::before { border-color: var(--accent); } }
.check:active { transform: scale(.92); }
.card.s-done .check { color: var(--accent-ink); }
.card.s-done .check::before { background: var(--accent); border-color: var(--accent); }
.card.s-skipped .check { color: var(--ink-3); }
.card.s-skipped .check::before { border-style: dashed; }
.card.s-deferred .check { color: var(--warn); }
.card.s-deferred .check::before { border-color: var(--warn); }
.card.s-missed .check { color: var(--danger); }
.card.s-missed .check::before { border-color: var(--danger); }
.card.s-locked .check::before { border-color: var(--line); }
.card-main { padding: 12px 12px 13px 4px; min-width: 0; background: none; border: 0; text-align: left; display: flex; flex-direction: column; gap: 3px; width: 100%; }
.card-eyebrow { font-size: 13px; font-weight: 500; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-title { font-size: 16.5px; font-weight: 700; line-height: 1.3; }
.card .chips { margin-top: 3px; }
.card.s-done .card-title, .card.s-skipped .card-title { color: var(--ink-3); }
.card.s-done .card-title { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--ink-3) 70%, transparent); text-decoration-thickness: 1.5px; }
.card.cat-story .card-title { font-size: 18px; font-weight: 800; }
.card-body { padding: 2px 16px 18px 52px; display: flex; flex-direction: column; gap: 14px; }
@media (max-width: 479px) { .card-body { padding-left: 16px; } }
.card-body .desc { color: var(--ink-2); }
.why { color: var(--ink); font-size: 15px; }
.why b { color: var(--ink); font-weight: 700; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 16px; font-size: 14px; margin: 0; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; color: var(--ink-2); min-width: 0; }
.unlocks { margin: 4px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.name-reveal { background: none; border: 0; padding: 0; color: var(--accent); font-size: 14px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; min-height: 32px; }

.missbox { border-left: 3px solid var(--danger); background: color-mix(in srgb, var(--danger) 7%, transparent); border-radius: 0 var(--r-md) var(--r-md) 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.missbox.temporary { border-left-color: var(--warn); background: color-mix(in srgb, var(--warn) 6%, transparent); }
.missbox-head { display: flex; align-items: center; gap: 8px; font-weight: 800; color: var(--danger); font-size: 15px; }
.missbox.temporary .missbox-head { color: var(--warn); }
.missbox-head svg { width: 18px; height: 18px; flex: none; }

.during { border: 1px dashed var(--line-strong); border-radius: var(--r-md); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.during .card { border-bottom: 0; }

/* Hints */
.hints { border-radius: var(--r-md); background: var(--bg-deep); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.hints-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.hint-steps { display: flex; gap: 3px; }
.hint-steps i { width: 20px; height: 4px; background: var(--surface-3); display: block; transition: background-color .3s var(--ease); }
.hint-steps i.on { background: var(--accent); }
.hint { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; }
.hint-n { width: 24px; height: 24px; border-radius: 4px; display: grid; place-items: center; font-size: 13px; font-weight: 800; background: var(--surface-2); color: var(--ink-2); line-height: 1; }
.hint.l4 .hint-n { background: var(--accent); color: var(--accent-ink); }
.hint-label { font-size: 13px; font-weight: 600; color: var(--ink-3); display: block; margin-bottom: 2px; }
.hint p { color: var(--ink); font-size: 15px; }
.hint-locked { color: var(--ink-3); font-size: 14px; }

.sources { margin: 0; padding-left: 18px; font-size: 14px; color: var(--ink-3); display: flex; flex-direction: column; gap: 4px; }
.sources a { overflow-wrap: anywhere; }
.sources.credits { list-style: none; padding: 0; gap: 12px; font-size: 15px; color: var(--ink-2); }
.sources.credits li { display: flex; flex-direction: column; gap: 2px; }
details.more > summary { cursor: pointer; color: var(--ink-3); font-size: 14px; font-weight: 700; list-style: none; display: flex; align-items: center; gap: 6px; min-height: 36px; transition: color var(--dur) var(--ease); }
details.more > summary:hover { color: var(--ink); }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "+"; width: 12px; font-size: 16px; font-weight: 600; }
details.more[open] > summary::before { content: "–"; }
details.more > div { display: flex; flex-direction: column; gap: 10px; padding-top: 8px; }

/* ── Chapter banner: the setting as a hard-edged photograph, title set on it ── */
.banner-hero { position: relative; isolation: isolate; display: flex; align-items: flex-end; min-height: clamp(250px, 66vw, 330px); padding: 0 0 18px; }
.banner { position: absolute; inset: 0; z-index: 0; overflow: hidden; display: block; background: var(--bg-deep); }
.banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(17, 22, 20, 0) 28%, rgba(17, 22, 20, .5) 58%, rgba(17, 22, 20, .9) 100%); }
.banner img { width: 100%; height: 100%; object-fit: cover; filter: brightness(.92) saturate(1.04); }
.banner-hero > .wrap { position: relative; z-index: 1; width: 100%; }
@media (min-width: 900px) { .banner-hero { min-height: 420px; padding-bottom: 26px; } }
html.is-entering [data-enter] .banner img { animation: fade .5s ease both; }

/* ── Now view ── */
.chapter-hero { padding-top: 28px; display: flex; flex-direction: column; gap: 6px; position: relative; }
.chapter-hero .kicker { font-size: 15px; font-weight: 700; color: var(--ink-2); }
.chapter-hero h1 { font-weight: 800; font-size: clamp(36px, 9vw, 68px); line-height: 1; letter-spacing: -0.01em; color: var(--ink); }
.chapter-hero .intro { color: var(--ink-2); max-width: 62ch; }
.chapter-hero .hero-meta { font-size: 15px; font-weight: 600; color: var(--ink-2); }
.chapter-hero.on-banner { padding-top: 0; }
.progress-line { display: flex; align-items: center; gap: 12px; margin-top: 8px; max-width: 440px; }
.progress-line .bar { flex: 1; }
.progress-line .num { font-size: 14px; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.on-banner .bar { background: rgba(227, 226, 218, .2); }
.bar { height: 5px; background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width .6s var(--ease); }
.bar.teal > i { background: var(--accent); }
.pace { display: flex; gap: 2px; background: var(--surface); border-radius: var(--r-md); padding: 3px; overflow-x: auto; scrollbar-width: none; }
.pace::-webkit-scrollbar { display: none; }
.pace button { flex: 1; min-height: 42px; border-radius: 4px; border: 0; background: none; color: var(--ink-3); font-weight: 700; font-size: 14.5px; padding: 0 12px; white-space: nowrap; transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease); }
.pace button:hover { color: var(--ink); }
.pace button[aria-pressed="true"] { background: var(--surface-3); color: var(--ink); }

.now-grid { display: flex; flex-direction: column; gap: 36px; margin-top: 24px; }
.now-grid .col { display: contents; }
.now-grid .section { margin-top: 0; }
.now-grid .o1 { order: 1; } .now-grid .o2 { order: 2; } .now-grid .o3 { order: 3; }
.now-grid .o4 { order: 4; } .now-grid .o5 { order: 5; } .now-grid .o6 { order: 6; }
@media (min-width: 1000px) {
  .now-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 48px; align-items: start; margin-top: 36px; }
  .now-grid .col { display: flex; flex-direction: column; gap: 40px; min-width: 0; }
  .now-grid .col-main { grid-column: 1 / 8; }
  .now-grid .col-side { grid-column: 8 / 13; }
}

.next { position: relative; border-radius: var(--r-xl); padding: 20px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.next-q { font-size: 14px; font-weight: 800; color: var(--accent); }
.next h2 { font-weight: 800; font-size: clamp(26px, 6vw, 36px); line-height: 1.08; letter-spacing: -0.01em; }
.next .why { font-size: 17px; line-height: 1.45; }
.next-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
.next-actions .btn-primary { grid-column: 1 / -1; min-height: 50px; font-size: 16px; }
.next-actions .btn { padding: 0 12px; }
.next-actions .btn:not(.btn-primary) { background: transparent; color: var(--ink-2); }
@media (hover: hover) { .next-actions .btn:not(.btn-primary):hover { background: var(--surface-2); color: var(--ink); } }
@media (min-width: 600px) {
  .next-actions { display: flex; flex-wrap: wrap; }
  .next-actions .btn-primary { min-width: 200px; margin-right: 6px; }
}
.q-label { display: flex; align-items: center; gap: 8px; }

.gatecheck { padding: 16px 0 0; display: flex; flex-direction: column; gap: 10px; border-top: 3px solid var(--line-strong); }
.gatecheck.ok { border-top-color: var(--accent); }
.gatecheck.warn { border-top-color: var(--danger); }
.gatecheck h3 { font-size: 17px; font-weight: 700; line-height: 1.3; color: var(--ink-2); }
.gatecheck .verdict { display: flex; align-items: flex-start; gap: 10px; font-weight: 700; font-size: 17px; line-height: 1.4; }
.gatecheck.ok .verdict { color: var(--ink); }
.gatecheck.ok .verdict svg { color: var(--accent); }
.gatecheck.warn .verdict { color: var(--danger); }
.verdict svg { width: 22px; height: 22px; flex: none; }
.mini-row {

/* ── Sheet ── */

/* ── Toast ── */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 14px); z-index: 50; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 6px 6px 6px 18px; display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 14.5px; box-shadow: 0 12px 32px rgba(0, 0, 0, .45); max-width: calc(100% - 32px); animation: up .22s var(--ease) both; }

/* ═════════════ Helpers ═════════════ */

  if (!x || typeof x !== "object") return s;
  s.items = x.items && typeof x.items === "object" ? x.items : {};
  s.hints = x.hints && typeof x.hints === "object" ? x.hints : {};
  s.names = x.names && typeof x.names === "object" ? x.names : {};

function mergeStates(a, b) {
  if (!b) return a;
  const out = freshState();
  for (const bucket of ["items", "hints", "names", "tips"]) {
    const A = a[bucket] || {}, B = b[bucket] || {};
    for (const k of new Set([...Object.keys(A), ...Object.keys(B)])) {

    }

  return out;
}

/* Cross-device sync. Two backends share one merge loop:

const FB_VERSION = "10.12.2";

/* ═════════════ Derived status ═════════════ */
const stored = (id) => (S.items[id] && S.items[id].s) || "todo";
const isResolved = (id) => { const s = stored(id); return s === "done" || s === "skipped"; };
const prereqsMet = (a) => (a.prerequisites || []).every((p) => !BY_ID.has(p) || isResolved(p));
function isMissed(a) {

}
function statusOf(a) {

  if (s === "done" || s === "skipped") return s;

  if (s === "deferred") return "deferred";

}
const isOpen = (a) => statusOf(a) === "todo";
function nextMain() { return ORDERED.find((a) => a.category === "story" && !isResolved(a.id)) || null; }
function currentChapterIdx() { const m = nextMain(); return m ? CH_IDX.get(m.chapter) : CH_IDX.get("post") ?? CHAPTERS.length - 1; }
const chapterIdx = (a) => CH_IDX.get(a.chapter);
const chapterOf = (a) => CHAPTERS[chapterIdx(a)];

function showName(a) {

  if (S.prefs.names === "always") return true;
  if (S.names[a.id] && S.names[a.id].r) return true;
  return chapterIdx(a) <= currentChapterIdx();
}
function displayTitle(a) {

  return showName(a) ? a.missionName : a.safeTitle;
}
const labelFor = (id) => { const a = BY_ID.get(id); return a ? displayTitle(a) : id; };

function chapterStats(cid) {
  const list = ACTS.filter((a) => a.chapter === cid);
  let done = 0, skipped = 0, missed = 0, open = 0;
  for (const a of list) {
    const s = statusOf(a);
    if (s === "done") done++; else if (s === "skipped") skipped++; else if (s === "missed") missed++; else open++;
  }
  const denom = list.length - skipped;
  return { total: list.length, done, skipped, missed, open, pct: pct(done, denom) };
}

  for (const a of ACTS) { const s = stored(a.id); if (s === "done") done++; else if (s === "skipped") skipped++; }
  return { done, skipped, total: ACTS.length, pct: pct(done, ACTS.length - skipped) };
}

/* ═════════════ Recommendation engine ═════════════ */
function recommendations() {
  const cur = currentChapterIdx();
  const curId = CHAPTERS[cur].id;
  const allowed = new Set(PACES[S.prefs.pace]?.priorities || PACES.savor.priorities);
  const eligible = (a) => isOpen(a) && !a.duringMission && !a.ambient && chapterIdx(a) <= cur;
  const nm = nextMain();
  const urgent = ORDERED.filter((a) => eligible(a) && a.missable && a.missable.hourglass);
  const gated = nm ? ORDERED.filter((a) => eligible(a) && a.missable && a.missable.locksAt === nm.id && a.missable.type !== "in-mission") : [];
  const walk = ORDERED.filter((a) => eligible(a) && a.chapter === curId && (a.category === "story" || allowed.has(a.priority)));
  const seen = new Set(); const out = [];
  for (const a of [...urgent, ...gated, ...walk]) if (!seen.has(a.id)) { seen.add(a.id); out.push(a); }
  return out;
}
function reasonFor(a, nm) {

  if (nm && a.missable && a.missable.locksAt === nm.id) return "Your next story mission closes this for good.";

}

}

/* ═════════════ UI state ═════════════ */

/* ═════════════ Actions ═════════════ */
let undoTimer = null;
function setStatus(id, s, { toast = true } = {}) {
  const prev = S.items[id] ? Object.assign({}, S.items[id]) : null;
  S.items[id] = { s, t: now() };
  persist();
  render();
  if (toast) {
    const a = BY_ID.get(id);
    const lost = a && a.category === "story" && s === "done" ? ACTS.filter((x) => x.missable && x.missable.locksAt === id && statusOf(x) === "missed").length : 0;
    const msg = (s === "done" ? "Marked done" : s === "skipped" ? "Skipped" : s === "deferred" ? "Saved for later" : "Moved back to to-do")
      + (lost ? ` · ${lost} item${lost > 1 ? "s" : ""} now missed` : "");
    showToast(msg, () => { if (prev) S.items[id] = Object.assign(prev, { t: now() }); else S.items[id] = { s: "todo", t: now() }; persist(); render(); });
  }
}
function toggleDone(id) { setStatus(id, stored(id) === "done" ? "todo" : "done"); }

  S.hints[id] = { l: Math.min(4, cur + 1), t: now() };
  persist(); render();
}
function hideHints(id) { S.hints[id] = { l: 0, t: now() }; persist(); render(); }

function setPref(k, v) { S.prefs[k] = v; S.prefsT = now(); persist(); render(); }

  root.innerHTML = `<div class="toast ${undo ? "" : "solo"}" role="status"><span>${esc(msg)}</span>${undo ? '<button data-action="undo">Undo</button>' : ""}</div>`;
  showToast.undo = undo || null;
  undoTimer = setTimeout(() => { root.innerHTML = ""; showToast.undo = null; }, undo ? 5000 : 2600);

/* ═════════════ Render: pieces ═════════════ */

  return `<span class="verif v-${v}" title="${esc(label + ": " + (DATA.meta.verificationLegend[v] || ""))}">${ICON[v] || ""}${withText ? esc(label) : ""}</span>`;

  const steps = [1, 2, 3, 4].map((n) => `<i class="${n <= lvl ? "on" : ""}"></i>`).join("");
  const shown = a.hints.slice(0, lvl).map((h, i) => `<div class="hint l${i + 1}"><span class="hint-n">${i + 1}</span><div><span class="hint-label">${HINT_LABELS[i]}</span><p>${esc(h)}</p></div></div>`).join("");
  const kind = lvl >= 2 && a.rewardCategory ? `<p class="muted small">Reward type: ${esc(DATA.taxonomy.rewardCategories[a.rewardCategory] || a.rewardCategory)}</p>` : "";
  const nextBtn = lvl < 4
    ? `<button class="btn btn-sm ${lvl === 0 ? "" : "btn-ghost"}" data-action="hint" data-id="${esc(a.id)}">Reveal hint ${lvl + 1} · ${HINT_LABELS[lvl]}</button>` : "";
  const hideBtn = lvl > 0 ? `<button class="btn btn-sm btn-ghost" data-action="hide-hints" data-id="${esc(a.id)}">Hide hints</button>` : "";
  return `<div class="hints">
    <div class="hints-head"><span class="eyebrow">Hints${lvl ? " · level " + lvl + " of 4" : ""}</span><span class="hint-steps" aria-hidden="true">${steps}</span></div>
    ${lvl === 0 ? `<p class="hint-locked">Hidden. Each level reveals a little more, and only when you ask.</p>` : shown}
    ${kind}
    <div class="actions">${nextBtn}${hideBtn}</div>
  </div>`;
}

function bodyHTML(a, opts = {}) {
  const st = statusOf(a);
  const parts = [];
  if (a.category === "story" && !showName(a)) {
    parts.push(`<p class="muted small">Mission name hidden because it's ahead of where you are. <button class="name-reveal" data-action="reveal-name" data-id="${esc(a.id)}">Show the name</button></p>`);
  }
  parts.push(`<p class="desc">${esc(a.spoilerFreeDescription)}</p>`);
  if (a.whyNow) parts.push(`<div><span class="eyebrow">Why now</span><p class="why">${esc(a.whyNow)}</p></div>`);
  if (a.unlocks && a.unlocks.length) parts.push(`<div><span class="eyebrow">Unlocks</span><ul class="unlocks">${a.unlocks.map((u) => `<li>${esc(u)}</li>`).join("")}</ul></div>`);
  if (fightVisible(a)) parts.push(`<div><span class="eyebrow">Fighting</span><p class="small">${esc(FIGHT[a.fight.level].label)}.${a.fight.note ? " " + esc(a.fight.note) : ""} ${verifBadge(a.fight, true)}</p></div>`);
  if (a.missable) parts.push(missBoxHTML(a));
  const during = DURING.get(a.id) || [];
  if (during.length) parts.push(`<div class="during"><span class="eyebrow">During this mission</span>${during.map((d) => cardHTML(d)).join("")}</div>`);
  if (st === "locked") {
    const needs = (a.prerequisites || []).filter((p) => !isResolved(p));
    parts.push(`<p class="muted small">${ICON.lock.replace("<svg", '<svg style="width:14px;height:14px;vertical-align:-2px"')} Available after: ${needs.map((p) => esc(labelFor(p))).join(", ")}</p>`);
  }
  const tipsHere = TIPS_FOR.get(a.id) || [];
  if (tipsHere.length) parts.push(`<div><span class="eyebrow">Tips</span><div class="list">${tipsHere.map(tipRow).join("")}</div></div>`);
  parts.push(hintsHTML(a));
  // Details
  const det = [];
  const pre = (a.prerequisites || []).filter((p) => BY_ID.has(p));
  det.push(`<dl class="kv">
    <dt>Chapter</dt><dd>${esc(chapterOf(a).title)}</dd>
    <dt>Order</dt><dd>${esc(a.recommendedOrder)}</dd>
    ${pre.length ? `<dt>Needs</dt><dd>${pre.map((p) => esc(labelFor(p)) + (isResolved(p) ? " ✓" : "")).join(", ")}</dd>` : ""}
    <dt>Character</dt><dd>${esc(CHAR_SHORT[a.character] || a.character || "Either")}</dd>
    ${a.trophy ? `<dt>Trophy</dt><dd>${esc(a.trophy)}</dd>` : ""}
    <dt>For 100%</dt><dd>${a.requiredFor100Percent ? "Counts toward 100%" : "Not required"}</dd>
    <dt>Research</dt><dd>${verifBadge(a, true)} · checked ${esc(a.lastVerified || "")}</dd>
  </dl>`);
  if (a.notes) det.push(`<p class="small muted">${esc(a.notes)}</p>`);
  if (a.sources && a.sources.length) det.push(sourcesListHTML(a.sources));
  parts.push(`<details class="more"><summary>Details, sources and spoiler notes</summary><div>${det.join("")}</div></details>`);
  // Actions
  const act = [];
  if (st !== "done" && !opts.hero) act.push(`<button class="btn btn-sm" data-action="status" data-s="done" data-id="${esc(a.id)}">${ICON.check}Done</button>`);
  if (st !== "deferred" && st !== "done" && st !== "skipped" && !opts.hero) act.push(`<button class="btn btn-sm btn-ghost" data-action="status" data-s="deferred" data-id="${esc(a.id)}">${ICON.clock}Later</button>`);
  if (st !== "skipped" && st !== "done") act.push(`<button class="btn btn-sm btn-ghost" data-action="status" data-s="skipped" data-id="${esc(a.id)}">Skip</button>`);
  if (stored(a.id) !== "todo") act.push(`<button class="btn btn-sm btn-ghost" data-action="status" data-s="todo" data-id="${esc(a.id)}">Reset</button>`);
  parts.push(`<div class="actions">${act.join("")}</div>`);
  return parts.join("");
}

const hostOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } };
function publisherOf(key) {
  const s = DATA.sources[key]; if (!s) return { id: key, name: key };
  const host = hostOf(s.url);
  const meta = (DATA.publishers || {})[host] || {};
  return { id: host || "project", host, name: meta.name || String(s.name).split(":")[0].trim(), support: meta.support || [] };
}
/* Short attribution on a step, tip or weapon; the full list lives on the Sources page. */
function sourcesListHTML(keys) {
  const names = [...new Set((keys || []).map((k) => publisherOf(k).name))];
  if (!names.length) return "";
  return `<p class="small muted">Checked against ${names.map(esc).join(", ")}. <button class="linkbtn" data-action="nav" data-view="sources">All sources</button></p>`;
}
function viewSources() {
  const use = new Map();
  for (const list of [DATA.activities, DATA.tips || [], DATA.weapons || []]) for (const x of list) for (const k of x.sources || []) use.set(k, (use.get(k) || 0) + 1);
  const groups = new Map();
  for (const [k, s] of Object.entries(DATA.sources)) {
    const p = publisherOf(k);
    if (!groups.has(p.id)) groups.set(p.id, { p, pages: [], refs: 0 });
    const g = groups.get(p.id); g.pages.push({ k, s }); g.refs += use.get(k) || 0;
  }
  const ordered = [...groups.values()].filter((g) => g.p.id !== "project").sort((a, b) => b.refs - a.refs || a.p.name.localeCompare(b.p.name));
  const project = groups.get("project");
  const card = (g) => `<div class="panel"><h3>${g.p.host ? `<a href="https://${esc(g.p.host)}/" target="_blank" rel="noopener">${esc(g.p.name)}</a>` : esc(g.p.name)}</h3>
    <p class="small muted">${g.refs ? `Cited in ${g.refs} place${g.refs === 1 ? "" : "s"}` : "Checked, not currently cited"} · ${g.pages.length} page${g.pages.length === 1 ? "" : "s"}</p>
    <ul class="sources">${g.pages.map(({ s }) => `<li>${/^https?:/.test(s.url) ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(String(s.name).replace(/^[^:]+:\s*/, "") || s.name)}</a>` : esc(s.name)}${s.published ? ` <span>(${esc(s.published)})</span>` : ""}</li>`).join("")}</ul>
    ${g.p.support && g.p.support.length ? `<p class="small">Support them: ${g.p.support.map((x) => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label)}</a>`).join(" · ")}</p>` : ""}</div>`;
  const supporters = ordered.filter((g) => g.p.support && g.p.support.length);
  return `<div class="wrap"><section class="chapter-hero">
    <span class="eyebrow">Acknowledgments</span>
    <h1>Thank you</h1>
    <p class="intro">Every fact in this guide was found, mapped or documented by someone else first. The guide is written in its own words and nothing here was tested in-game, but it only exists because these people did the legwork. Read their full guides, and if you can, support them.</p>
    <p><button class="btn btn-sm" data-action="nav" data-view="now">Back to the guide</button></p>
  </section>
  ${supporters.length ? `<section class="section"><h2 class="section-title">Support the people behind this guide</h2>
    <div class="panel"><p class="small muted">These sites publish a way to support them. Links appear only where a site offers one.</p>
    <ul class="sources">${supporters.map((g) => `<li><b>${esc(g.p.name)}</b>: ${g.p.support.map((x) => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label)}</a>`).join(" · ")}</li>`).join("")}</ul></div></section>` : ""}
  <section class="section"><h2 class="section-title">Everyone we learned from (${ordered.length})</h2><div class="progress-cols"><div>${ordered.filter((_, i) => i % 2 === 0).map(card).join("")}</div><div>${ordered.filter((_, i) => i % 2 === 1).map(card).join("")}</div></div></section>
  ${project ? `<section class="section"><h2 class="section-title">This guide's own notes</h2><div class="panel"><ul class="sources">${project.pages.map(({ s }) => `<li>${esc(s.name)}</li>`).join("")}</ul></div></section>` : ""}
  <section class="section"><div class="panel"><h3>Listed here and want a change?</h3><p class="small muted">If you run one of these sites and want a link corrected, a support link added, or an entry removed, <a href="https://github.com/davidarechiga/gta6-completionist-journey/issues" target="_blank" rel="noopener">open an issue</a>. Support links appear only where a site publishes one.</p></div></section>
  ${footHTML()}</div>`;
}

/* ═════════════ Tips ═════════════ */
function tipTopicName(k) { return ((DATA.taxonomy && DATA.taxonomy.tipTopics) || {})[k] || k; }
function tipRow(t) {
  return `<button class="mini-row" data-action="tip-goto" data-id="${esc(t.id)}"><span class="t">${esc(t.title)}<small>${esc(tipTopicName(t.topic))}</small></span>${ICON.chev}</button>`;
}
/* The one tip worth a line on the Next up card: a nudge for this step's category or this step, once it applies. */
function tipNudgeFor(a) {
  if (!a) return null;
  const live = TIPS.filter((t) => t.nudge && t.nudge.text && (!t.from || isResolved(t.from)));
  return live.find((t) => (t.related || []).includes(a.id)) || live.find((t) => (t.nudge.on || []).includes(a.category)) || null;
}
const tipHidden = (id) => !!(S.tips[id] && S.tips[id].h);
/* Up to three tips for the Now tab: ones tied to what's next, then ones that just unlocked this chapter,
   then one per topic so the list doesn't fill up with a single subject. Hidden tips and the card's own nudge are skipped. */
function tipsForNow(hero, recs, nm) {
  const nudgeId = (tipNudgeFor(hero) || {}).id;
  const near = new Map([hero, ...recs.slice(1, 4), nm].filter(Boolean).map((a) => [a.id, a]));
  const curCh = CHAPTERS[currentChapterIdx()].id;
  const scored = [];
  for (const t of TIPS) {
    if (t.id === nudgeId || tipHidden(t.id) || (t.from && !isResolved(t.from))) continue;
    const rel = (t.related || []).map((id) => near.get(id)).find(Boolean);
    const fromStep = t.from && BY_ID.get(t.from);
    if (rel) scored.push({ t, score: 3, why: "For " + displayTitle(rel), near: true });
    else if (fromStep && fromStep.chapter === curCh) scored.push({ t, score: 2, why: "New since " + displayTitle(fromStep) });
    else scored.push({ t, score: t.verificationStatus === "verified" ? 1 : 0, why: tipTopicName(t.topic) });
  }
  scored.sort((x, y) => y.score - x.score);
  const out = [], topics = new Set();
  for (const x of scored) {
    if (out.length === 3) break;
    if (x.score < 2 && topics.has(x.t.topic)) continue;
    topics.add(x.t.topic); out.push(x);
  }
  return out;
}
function tipNowHTML({ t, why, near }) {
  const open = UI.expanded.has(t.id);
  return `<article class="tip tip-now ${open ? "is-open" : ""}" id="tip-${esc(t.id)}">
    <button class="tip-main" data-action="expand" data-id="${esc(t.id)}" aria-expanded="${open}">
      <span class="tip-why ${near ? "is-near" : ""}">${esc(why)}</span>
      <span class="tip-title">${esc(t.title)}</span>
      <span class="tip-sum">${esc(t.summary)}</span>
    </button>
    <button class="tip-hide" data-action="tip-hide" data-id="${esc(t.id)}" aria-label="Hide this tip from Now: ${esc(t.title)}">${ICON.x}</button>
    ${open ? `<div class="tip-body">${tipBodyHTML(t)}</div>` : ""}
  </article>`;
}
function tipMatch(t, q) {
  const hay = [t.title, t.summary, ...(t.points || []), tipTopicName(t.topic)].join(" ").toLowerCase();
  return q.split(/\s+/).filter(Boolean).every((w) => hay.includes(w));
}
function tipHTML(t) {
  const open = UI.expanded.has(t.id);
  const chips = [
    t.from ? `<span class="chip">${isResolved(t.from) ? "" : ICON.lock}From ${esc(labelFor(t.from))}</span>` : "",
    t.verificationStatus !== "verified" ? verifBadge(t, true) : "",
  ].join("");
  return `<article class="tip ${open ? "is-open" : ""}" id="tip-${esc(t.id)}">
    <button class="tip-main" data-action="expand" data-id="${esc(t.id)}" aria-expanded="${open}">
      <span class="tip-title">${esc(t.title)}</span>
      <span class="tip-sum">${esc(t.summary)}</span>
      ${chips ? `<span class="chips">${chips}</span>` : ""}
    </button>
    ${open ? `<div class="tip-body">${tipBodyHTML(t)}</div>` : ""}
  </article>`;
}
function tipBodyHTML(t) {
  const parts = [];
  if (t.points && t.points.length) parts.push(`<ul class="tip-points">${t.points.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>`);
  const rel = (t.related || []).map((id) => BY_ID.get(id)).filter(Boolean);
  if (rel.length) parts.push(`<div><span class="eyebrow">In the journal</span><div class="list">${rel.map((a) => miniRow(a)).join("")}</div></div>`);
  const det = [`<dl class="kv"><dt>Topic</dt><dd>${esc(tipTopicName(t.topic))}</dd><dt>Research</dt><dd>${verifBadge(t, true)} · checked ${esc(t.lastVerified || "")}</dd></dl>`];
  if (t.notes) det.push(`<p class="small muted">${esc(t.notes)}</p>`);
  if (t.sources && t.sources.length) det.push(sourcesListHTML(t.sources));
  parts.push(`<details class="more"><summary>Sources and caveats</summary><div>${det.join("")}</div></details>`);
  return parts.join("");
}

function gateHTML(m) {
  const g = m.gate; if (!g) return "";
  const open = lostAtMission(m);
  const done = isResolved(m.id);
  return `<section class="gate ${g.severity === "soft" ? "soft" : ""}">
    <div class="gate-eyebrow">${ICON.warn}${g.kind === "choice" ? "Save before you choose" : g.severity === "soft" ? "Heads up before the next mission" : "Point of no return"}${done ? " · passed" : ""}</div>
    <h3>${esc(g.title)}</h3>
    <p>${esc(g.warning)}</p>
    <div class="gate-cols">
      ${g.lose && g.lose.length ? `<div><h4>Won't carry over</h4><ul>${g.lose.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
      ${g.keep && g.keep.length ? `<div><h4>Carries over</h4><ul>${g.keep.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
    </div>

    ${!done && !open.length && g.kind !== "choice" ? `<p class="small" style="color:var(--teal)">Everything tracked here is handled.</p>` : ""}
    ${g.save ? `<p class="gate-save">${ICON.save}<span>${esc(g.save)}</span></p>` : ""}
  </section>`;
}
function miniRow(a, sub) {
  return `<button class="mini-row" data-action="goto" data-id="${esc(a.id)}"><span class="t">${esc(displayTitle(a))}<small>${esc(sub || (chapterOf(a).title + " · " + (a.region || "")))}</small></span>${ICON.chev}</button>`;
}

/* ═════════════ Views ═════════════ */
function viewNow() {
  const cur = currentChapterIdx();
  const ch = CHAPTERS[cur];
  const stats = chapterStats(ch.id);
  const recs = recommendations();
  const nm = nextMain();
  const hero = recs[0];
  const pace = S.prefs.pace;
  const kicker = ch.number === 0 ? "" : ch.postGame ? "Free roam" : "Chapter " + ch.number;
  let h = `<section class="banner-hero" data-enter>${bannerHTML(ch.id)}<div class="wrap"><div class="chapter-hero on-banner hero-text">
    ${kicker ? `<span class="kicker">${kicker}</span>` : ""}
    <h1>${esc(ch.title)}</h1>
    <p class="hero-meta">${esc(ch.base)} · ${esc(ch.protagonists.join(" & "))}</p>
    <div class="progress-line"><div class="bar"><i style="width:${stats.pct}%"></i></div><span class="num">${stats.done} of ${stats.total - stats.skipped} done</span></div>
  </div></div></section><section class="board"><div class="wrap">`;
  // Desktop: main column = next up and also open; side column = the advance check, keep in mind, leftovers.
  // Phones: one column in the "o" order: next, advance check, keep in mind, also open, leftovers.
  const main = [], side = [];

  // Q1 + Q2: what next, and why
  if (hero) {
    const open = UI.heroOpen;
    const during = DURING.get(hero.id) || [];
    const reason = reasonFor(hero, nm);
    let nudge = tipNudgeFor(hero);
    if (fightVisible(hero) && nudge && !(nudge.related || []).includes(hero.id)) nudge = null;
    const tags = [hero.region ? `<span class="chip">${esc(hero.region)}</span>` : "", missChip(hero), priorityChip(hero), teaserChip(hero), charChip(hero),
      hero.timeOfDay ? `<span class="chip">${ICON.moon}${esc(hero.timeOfDay)}</span>` : "", hero.verificationStatus === "unconfirmed" ? verifBadge(hero, true) : ""].join("");
    main.push(`<section class="section o1"><div class="next">
      <span class="next-q">Next up · ${esc(DATA.taxonomy.categories[hero.category] || hero.category)}</span>
      <h2>${esc(displayTitle(hero))}</h2>
      ${tags ? `<div class="chips">${tags}</div>` : ""}
      <p class="why">${esc(reason)}</p>
      ${hero.category === "story" && hero.whyNow && hero.spoilerFreeDescription !== reason ? `<p class="small" style="color:var(--ink-2)">${esc(hero.spoilerFreeDescription)}</p>` : ""}
      ${fightLineHTML(hero)}
      ${nudge ? `<p class="tip-nudge"><b>Tip</b><span>${esc(nudge.nudge.text)} <button class="linkbtn" data-action="tip-goto" data-id="${esc(nudge.id)}">More</button></span></p>` : ""}
      ${during.length ? `<div class="missbox"><div class="missbox-head">${ICON.warn}<span>${during.length} one-time pickup${during.length > 1 ? "s" : ""} inside this mission</span></div>${during.map((d) => `<p class="small">${esc(d.spoilerFreeDescription)}</p>`).join("")}<p class="small muted">Open the hints if you want a nudge before you start.</p></div>` : ""}
      <div class="next-actions">
        <button class="btn btn-primary" data-action="status" data-s="done" data-id="${esc(hero.id)}">${ICON.check}Done</button>
        <button class="btn" data-action="status" data-s="deferred" data-id="${esc(hero.id)}">Later</button>
        <button class="btn" data-action="hero-toggle" aria-expanded="${open}">${open ? "Less" : "Hints and details"}</button>
      </div>
      ${open ? `<div class="card-body" style="padding:16px 0 0;border-top:1px solid var(--line-strong)">${bodyHTML(hero, { hero: true })}</div>` : ""}
    </div></section>`);
  } else {
    main.push(`<section class="section o1"><div class="next"><span class="next-q">Next up</span><h2>You're all caught up</h2><p class="why">Nothing open at your current pace. Try a wider pace, or check items you saved for later.</p></div></section>`);
  }

  // Q3: will I miss anything?
  if (nm) {
    const lost = lostAtMission(nm);
    const gate = nm.gate;
    const warn = lost.length > 0 || (gate && gate.severity === "hard");
    const during = DURING.get(nm.id) || [];
    const name = esc(displayTitle(nm)) + (nm.marker && showName(nm) ? ` <span class="muted" style="font-weight:500">(${esc(nm.marker)})</span>` : "");
    side.push(`<section class="section o2"><div class="gatecheck ${warn ? "warn" : "ok"}">
      <h2 class="section-title">Before you advance</h2>
      ${lost.length ? `<div class="verdict">${ICON.warn}<span>Finish ${lost.length === 1 ? "this" : "these " + lost.length} before ${name}. Starting it closes ${lost.length === 1 ? "it" : "them"} for good.</span></div><div class="list">${lost.map((a) => miniRow(a, firstSentence(a.missable.warning))).join("")}</div>`
        : gate && gate.severity === "hard" ? `<div class="verdict">${ICON.warn}<span>${name} is a point of no return. Nothing tracked is still open.</span></div>`
        : `<div class="verdict">${ICON.shield}<span>Safe to start ${name}. Nothing known is lost.</span></div>`}
      ${gate ? `<p class="small">${esc(gate.warning)}</p>${gate.save ? `<p class="gate-save">${ICON.save}<span>${esc(gate.save)}</span></p>` : ""}` : ""}
      ${during.length ? `<p class="small muted">${during.length} one-time pickup${during.length > 1 ? "s" : ""} happen${during.length > 1 ? "" : "s"} inside this mission. Check its card before you start.</p>` : ""}
      ${nm !== hero ? fightLineHTML(nm) : ""}

  }

  const tipsNow = tipsForNow(hero, recs, nm);
  const amb = ambientNow().slice(0, 2);
  if (tipsNow.length || amb.length) {
    side.push(`<section class="section o3"><div class="section-head"><h2 class="section-title">Keep in mind</h2><button class="btn btn-sm btn-ghost" data-action="nav" data-view="tips">All tips</button></div><div class="list">${tipsNow.map(tipNowHTML).join("")}${amb.map((a) => cardHTML(a)).join("")}</div></section>`);
  }

  // Also open, with the pace that decides what shows here
  const lostIds = new Set(lostAtMission(nm).map((a) => a.id));
  const rest = recs.slice(1).filter((a) => !lostIds.has(a.id));
  const more = rest.slice(0, 3);

function filterMatch(a) {
  const f = UI.filters;
  if (f.pri.length && !(a.category === "story" ? f.pri.includes("story") : f.pri.includes(a.priority))) return false;
  if (f.cat.length && !f.cat.includes(a.category)) return false;
  const st = statusOf(a);
  if (f.status === "todo" && !(st === "todo" || st === "locked")) return false;
  if (f.status !== "all" && f.status !== "todo" && st !== f.status) return false;
  if (f.missable && !a.missable) return false;
  if (f.available && st !== "todo") return false;
  if (f.weapons && !(a.uniqueWeapons > 0)) return false;
  if (f.character !== "any" && !(a.character === f.character || a.character === "Both" || a.character === "Either")) return false;
  if (f.verif !== "any" && a.verificationStatus !== f.verif) return false;

function searchMatch(a, q) {

  return q.split(/\s+/).filter(Boolean).every((w) => hay.includes(w));
}

/* ═════════════ Unique weapons checklist (data: weapons[], taxonomy.weaponGroups, taxonomy.weaponHow) ═════════════

function weaponGot(w) {

const WHOW_FILTER = { found: ["found"], robbery: ["robbery"], shop: ["shop"], mission: ["mission", "challenge", "encounter"], unknown: ["unknown"], edition: ["edition"] };

  if (!q) return true;
  const hay = [w.type, w.area, w.where, weaponHow(w), (DATA.taxonomy.weaponGroups || {})[w.group], S.prefs.wnames ? w.name : ""].join(" ").toLowerCase();

function weaponGroupHTML(label, all, rows, note) {

const wTypeRank = (w) => { const i = Object.keys(DATA.taxonomy.weaponGroups || {}).indexOf(w.group); return i < 0 ? 99 : i; };
function weaponsByType(shown) {
  let h = "";
  for (const [g, label] of Object.entries(DATA.taxonomy.weaponGroups || {})) {
    /* Located rows first, then ones nobody has found, then edition extras. */
    const rank = (w) => (w.edition ? 2 : w.how === "unknown" ? 1 : 0);
    const rows = shown.filter((w) => w.group === g).sort((a, b) => rank(a) - rank(b));

/* Story order: only a linked Journal step gives a sourced point in the story. Those rows sit in that step's chapter,
   in Journal order. Everything else is grouped by how you get it, and the page says plainly that its timing is unknown. */
function weaponsByStory(shown) {
  const stepOf = (w) => (w.step && BY_ID.has(w.step) ? BY_ID.get(w.step) : null);
  let h = "";
  for (const c of CHAPTERS) {
    const inCh = (w) => { const a = stepOf(w); return a && a.chapter === c.id; };
    const rows = shown.filter(inCh).sort((x, y) => (stepOf(x).recommendedOrder - stepOf(y).recommendedOrder) || (wTypeRank(x) - wTypeRank(y)));
    if (rows.length) h += weaponGroupHTML(`${chapterName(c)} · ${c.title}`, WEAPONS.filter(inCh), rows);
  }
  const loose = (w) => !stepOf(w);
  const shownLoose = shown.filter(loose);

  const opener = ACTS.find((a) => (a.unlocks || []).some((u) => /ammu-nation/i.test(u)));

/* ═════════════ Work in progress (meta.workInProgress + chapters[].coverage) ═════════════
   The update-guide skill keeps these current; a new dataVersion re-opens the card. */
const COVERAGE = { solid: "Well covered", partial: "Gaps remain", thin: "Still thin" };
const WIP_TOPO = (() => {
  const ring = (k) => {
    const r = 12 + k * 16, n = 72; let s = "";
    for (let i = 0; i <= n; i++) {
      const t = (i / n) * Math.PI * 2;
      const w = 1 + 0.15 * Math.sin(3 * t + k * 0.7) + 0.08 * Math.sin(5 * t - k * 1.3) + 0.04 * Math.cos(7 * t + k);
      s += (i ? "L" : "M") + (232 + Math.cos(t) * r * w * 1.3).toFixed(1) + " " + (78 + Math.sin(t) * r * w * 0.82).toFixed(1);
    }
    return s + "Z";
  };
  const inner = [1, 2, 3, 4, 5].map(ring).join(""), edge = [6, 7, 8].map(ring).join("");
  return `<svg class="wip-topo" viewBox="0 0 340 230" aria-hidden="true" focusable="false"><path d="${inner}"/><path class="edge" d="${edge}"/></svg>`;
})();
function coverageOf(c) { const l = c && c.coverage && c.coverage.level; return COVERAGE[l] ? l : "solid"; }
function fmtDay(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
  return m ? new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : (s || "");
}
function chapterShort(c) { return c.number === 0 ? "P" : c.postGame ? "Post" : String(c.number); }
function chapterLong(c) { return c.number === 0 ? "the Prologue" : c.postGame ? "free roam" : "Chapter " + c.number; }
function wipHTML({ place = "progress" } = {}) {
  const w = DATA.meta.workInProgress;
  if (!w || !w.show) return "";
  const cur = CHAPTERS[currentChapterIdx()];
  const latest = (DATA.changelog || []).slice(-1)[0];
  const updated = fmtDay(DATA.meta.lastUpdated);
  const lv = coverageOf(cur);
  const map = CHAPTERS.map((c) => `<span class="wip-seg${c.id === cur.id ? " here" : ""}" title="${esc(c.title)}: ${COVERAGE[coverageOf(c)]}"><i class="lv-${coverageOf(c)}"></i><b>${chapterShort(c)}</b></span>`).join("");
  const spoken = CHAPTERS.map((c) => `${chapterShort(c) === "P" ? "Prologue" : chapterShort(c) === "Post" ? "Post-game" : "Chapter " + c.number}: ${COVERAGE[coverageOf(c)]}`).join("; ");
  return `<div class="wip" role="note" aria-label="Work in progress">${WIP_TOPO}
    <div class="wip-head"><span class="wip-live"><i></i>Work in progress</span><span class="wip-date">Updated ${esc(updated)}</span></div>
    <h3>${esc(w.headline)}</h3>
    <p class="lede">${esc(w.body)}</p>
    <div class="wip-cov"><div class="wip-map" style="--n:${CHAPTERS.length}" role="img" aria-label="Guide coverage by chapter. ${esc(spoken)}. You're in ${esc(chapterLong(cur))}.">${map}</div>
      <div class="wip-legend" aria-hidden="true">${Object.entries(COVERAGE).map(([k, t]) => `<span><i class="lv-${k}"></i>${t}</span>`).join("")}</div></div>
    ${lv !== "solid" && cur.coverage.note ? `<p class="wip-here"><b>You're in ${esc(chapterLong(cur))}.</b> ${esc(cur.coverage.note)}</p>` : ""}
    ${w.focus && w.focus.length ? `<div class="wip-block"><span class="eyebrow">Still charting</span><ul class="wip-focus">${w.focus.map((f) => `<li>${esc(f)}</li>`).join("")}</ul></div>` : ""}
    ${latest && latest.note ? `<div class="wip-block wip-new"><span class="eyebrow">Latest update · ${esc(fmtDay(latest.date))}</span><p class="small">${esc(latest.note)}</p></div>` : ""}
    ${place === "pop" ? `<div class="wip-actions"><button class="btn btn-sm" data-action="wip-gaps">Every open question</button></div>` : ""}
  </div>`;
}
function coverageNoteHTML(c) {

/* ═════════════ Header popovers: completion summary and work in progress ═════════════

      ${WEAPONS.length ? (() => { const w = weaponStats(); return row("Unique weapons", `${w.got} of ${w.total}`); })() : ""}
      ${row("Missables handled", `${handled} of ${miss.length}`)}
      ${row("Missables open now", openNow, openNow ? "warn" : "")}
      ${missed ? row("Missed for good", missed, "bad") : ""}

}
const POP = { which: null, pinned: false, timer: 0, html: "" };
const popAnchor = (w) => (w === "stats" ? $("#ring") : $("#wipBtn"));
function popPlace() {
  const pop = $("#pop"), a = popAnchor(POP.which);
  if (!pop || !a) return;
  const r = a.getBoundingClientRect(), vw = document.documentElement.clientWidth, w = pop.offsetWidth;
  pop.style.top = Math.round(r.bottom + 6) + "px";
  pop.style.left = Math.round(Math.max(12, Math.min(r.right - w, vw - w - 12))) + "px";
  pop.style.maxHeight = Math.max(200, Math.round(window.innerHeight - r.bottom - 22)) + "px";
}
function popRender() {
  for (const w of ["stats", "wip"]) { const b = popAnchor(w); if (b) b.setAttribute("aria-expanded", String(POP.which === w)); }
  const root = $("#popRoot");
  const html = !POP.which || !DATA ? "" : POP.which === "stats" ? statsPopHTML() : wipHTML({ place: "pop" });
  if (!html) { POP.which = null; POP.html = ""; root.innerHTML = ""; return; }
  if (html === POP.html && $("#pop")) { popPlace(); return; }
  POP.html = html;
  root.innerHTML = `<div class="pop pop-${POP.which}" id="pop" role="dialog" tabindex="-1" aria-label="${POP.which === "stats" ? "Completion summary" : "Work in progress"}">${html}</div>`;
  popPlace();
}
function popOpen(which, pin) {
  clearTimeout(POP.timer);
  const changed = POP.which !== which;
  POP.which = which;
  POP.pinned = changed ? !!pin : POP.pinned || !!pin;
  if (changed) popRender();
  if (which === "wip" && POP.which === "wip" && UI.wipSeen !== DATA.meta.dataVersion) { UI.wipSeen = DATA.meta.dataVersion; saveUI(); wipBtnRender(); }
}
function popClose() {
  clearTimeout(POP.timer);
  if (!POP.which) return;
  POP.which = null; POP.pinned = false;
  popRender();
}
function wipBtnRender() {
  const b = $("#wipBtn");
  if (!b || !DATA) return;
  const w = DATA.meta.workInProgress, on = !!(w && w.show);
  const fresh = on && UI.wipSeen !== DATA.meta.dataVersion;
  b.hidden = !on;
  b.querySelector(".wip-dot").hidden = !fresh;
  b.setAttribute("aria-label", fresh ? "Work in progress. The guide was updated." : "Work in progress");
}
document.addEventListener("pointerover", (e) => {
  if (e.pointerType !== "mouse" || !DATA) return;
  const t = e.target.closest("[data-pop]");
  if (t) { if (!(POP.pinned && POP.which !== t.dataset.pop)) popOpen(t.dataset.pop, false); return; }
  if (e.target.closest("#pop")) clearTimeout(POP.timer);
});
document.addEventListener("pointerout", (e) => {
  if (e.pointerType !== "mouse" || POP.pinned || !POP.which) return;
  if (!e.target.closest("[data-pop], #pop")) return;
  const to = e.relatedTarget && e.relatedTarget.closest ? e.relatedTarget.closest("[data-pop], #pop") : null;
  if (to && (to.id === "pop" || to.dataset.pop === POP.which)) return;
  clearTimeout(POP.timer);
  POP.timer = setTimeout(popClose, 200);
});
window.addEventListener("resize", () => popClose());

/* ═════════════ Ask the guide (the artifact's sample capability) ═════════════
   Answers come only from walkthrough.json. Each question sends a spoiler-safe index of every step plus
   the player's progress; two page tools hand Claude a step's full entry or search the guide's text.
   Each question spends the viewer's own Claude usage, and the first one asks their permission. */
const ASK_KEY = "completionist-journey:ask:v1";
const ASK_OFF = ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"];
const ASK_ERR = {
  cancelled: "Stopped.",
  rate_limited: "Claude is busy, or you've reached your usage limit. Try again in a little while.",
  session_expired: "Your claude.ai sign-in has expired. Sign in again, then ask.",
  refused: "Claude couldn't answer that. Try asking it another way.",
  empty_completion: "No answer came back. Try a shorter question.",
  prompt_too_large: "This chat has grown too long. Clear it and ask again.",
  not_granted: "This page isn't allowed to use Claude, so asking is off. Reload the page if you want to be asked again.",
  sampling_disabled: "Claude isn't available for your account here.",
  tools_unavailable: "Claude couldn't open the guide's full entries here. Ask again for an answer from the step list.",
};
const askErrText = (c) => ASK_ERR[c] || (ASK_OFF.includes(c) ? "Asking Claude isn't available on this page right now." : "Couldn't reach Claude. Try again.");
const VERIF_WORD = { verified: "Verified", community: "Community-reported", unconfirmed: "Unconfirmed" };
const ASK = { fn: undefined, limits: null, reason: "", log: [], busy: false, ctl: null, open: false, ready: null };
try {
  const l = JSON.parse(lsGet(ASK_KEY) || "[]");
  if (Array.isArray(l)) ASK.log = l.filter((x) => x && typeof x.q === "string").slice(-20).map((x) => ({ q: x.q, a: String(x.a || ""), err: String(x.err || ""), status: "" }));
} catch { /* start with an empty chat */ }
function askSave() { lsSet(ASK_KEY, JSON.stringify(ASK.log.slice(-20).map(({ q, a, err }) => ({ q, a, err })))); }
const isLocalDev = () => /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);

async function askInit() {
  if (window.claude && typeof window.claude.use === "function") {
    $("#askbar").hidden = false;
    try { ASK.fn = await window.claude.use("sample"); } catch { ASK.fn = null; }
    if (ASK.fn) { try { ASK.limits = await ASK.fn.limits(); } catch { ASK.limits = null; } }
    else ASK.reason = "off";
  } else {
    ASK.fn = null;
    ASK.reason = isLocalDev() ? "local" : "off";
  }
  askBarRender();
}
function askBarRender() {
  const bar = $("#askbar");
  if (!bar) return;
  bar.hidden = ASK.reason === "off";
  const inp = $("#askBarInput");
  if (inp) inp.placeholder = ASK.log.length ? "Ask a follow-up" : "Ask the guide a question";
  syncHead();
}

function askBrief(withTools) {
  const ci = currentChapterIdx(), cur = CHAPTERS[ci], nm = nextMain();
  const o = overallStats(), cs = chapterStats(cur.id);
  const risk = lostAtMission(nm);
  const next = recommendations()[0];
  const pace = PACES[S.prefs.pace] || PACES.savor;
  const steps = ORDERED.map((a) => {
    const m = a.missable;
    const flags = [m ? (m.hourglass ? "timed missable" : m.type === "in-mission" ? "missable inside its mission" : "missable") : "",
      a.gate ? (a.gate.severity === "hard" ? "point of no return" : "choice inside") : "", a.uniqueReward ? "unique reward" : "", a.uniqueWeapons ? a.uniqueWeapons + " unique weapon" + (a.uniqueWeapons > 1 ? "s" : "") : "",
      a.ambient ? "habit" : "", a.duringMission ? "pickup inside " + a.duringMission : "", fightVisible(a) ? "fight: " + a.fight.level : ""].filter(Boolean).join(", ");
    return [a.id, chapterShort(chapterOf(a)), a.category, a.priority, statusOf(a), displayTitle(a).replace(/\s*\|\s*/g, " / "), flags || "-", a.verificationStatus].join(" | ");
  });
  const chapters = CHAPTERS.map((c) => `${chapterShort(c)} = ${chapterName(c)}: ${c.title} (coverage: ${COVERAGE[coverageOf(c)].toLowerCase()}${c.coverage && c.coverage.note ? ". " + c.coverage.note : ""})`);
  const gaps = (DATA.researchGaps || []).map((g) => `- ${g.area}: ${g.detail}`);
  return [
`You are "Ask the guide", the helper inside an unofficial, spoiler-light completionist companion for Grand Theft Auto VI. The player asks you questions while they play.

Rules:

function askSearch(query) {

    const hidden = a.category === "story" && !showName(a);
    const text = [hidden ? a.safeTitle : a.title, a.region, a.spoilerFreeDescription, a.whyNow, ...(a.hints || []), a.notes, ...(a.unlocks || []), a.missable && a.missable.warning]
      .filter(Boolean).map(String).join(" · ");
    const hay = text.toLowerCase();
    const found = words.filter((w) => hay.includes(w));
    if (!found.length) continue;
    const at = hay.indexOf(found[0]);
    hits.push({ id: a.id, title: displayTitle(a), chapter: chapterName(chapterOf(a)), status: statusOf(a), score: found.length, snippet: text.slice(Math.max(0, at - 60), at + 110).replace(/\s+/g, " ").trim() });
  }
  for (const t of TIPS) {
    const text = [t.title, t.summary, ...(t.points || []), t.notes, tipTopicName(t.topic)].filter(Boolean).map(String).join(" · ");
    const hay = text.toLowerCase();
    const found = words.filter((w) => hay.includes(w));
    if (!found.length) continue;
    const at = hay.indexOf(found[0]);
    hits.push({ id: t.id, title: t.title, chapter: "Tip · " + tipTopicName(t.topic), status: "tip", score: found.length, snippet: text.slice(Math.max(0, at - 60), at + 110).replace(/\s+/g, " ").trim() });
  }
  for (const w of WEAPONS) {
    const text = [w.name, w.type, w.area, w.where, weaponHow(w), w.notes].filter(Boolean).map(String).join(" · ");
    const hay = text.toLowerCase();
    const found = words.filter((x) => hay.includes(x));
    if (!found.length) continue;
    const at = hay.indexOf(found[0]);
    hits.push({ id: w.id, title: w.type + (w.area ? " · " + w.area : ""), chapter: "Unique weapon", status: weaponGot(w) ? "collected" : "not yet", score: found.length, snippet: text.slice(Math.max(0, at - 60), at + 110).replace(/\s+/g, " ").trim() });
  }

}

  const endList = () => { if (list) { out.push(`<${list.tag}>${list.items.map((i) => `<li>${askInline(i)}</li>`).join("")}</${list.tag}>`); list = null; } };
  for (const raw of String(text).split("\n")) {
    const line = raw.trim();
    const ul = /^[-*•]\s+(.*)$/.exec(line), ol = /^\d+[.)]\s+(.*)$/.exec(line);
    if (ul || ol) {

      const tag = ul ? "ul" : "ol";

      list.items.push((ul || ol)[1]);
