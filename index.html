const now = () => Date.now();
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } }
function stable(o) {
  if (Array.isArray(o)) return "[" + o.map(stable).join(",") + "]";
  if (o && typeof o === "object") return "{" + Object.keys(o).sort().map((k) => JSON.stringify(k) + ":" + stable(o[k])).join(",") + "}";
  return JSON.stringify(o);
}
const pct = (n, d) => (d ? Math.round((n / d) * 100) : 0);
const firstSentence = (s) => { const m = String(s || "").match(/^.*?[.!?](?=\s|$)/); return m ? m[0] : String(s || ""); };

/* ═════════════ Data ═════════════ */
let DATA = null, ACTS = [], BY_ID = new Map(), CHAPTERS = [], CH_IDX = new Map(), DURING = new Map(), ORDERED = [];

function indexData(d) {
  DATA = d;
  CHAPTERS = d.chapters.slice().sort((a, b) => a.number - b.number);
  CHAPTERS.forEach((c, i) => CH_IDX.set(c.id, i));
  ACTS = d.activities;
  BY_ID = new Map(ACTS.map((a) => [a.id, a]));
  ORDERED = ACTS.slice().sort((a, b) => (CH_IDX.get(a.chapter) - CH_IDX.get(b.chapter)) || (a.recommendedOrder - b.recommendedOrder));
  DURING = new Map();
  for (const a of ACTS) if (a.duringMission) {
    if (!DURING.has(a.duringMission)) DURING.set(a.duringMission, []);
    DURING.get(a.duringMission).push(a);
  }
}

/* ═════════════ Progress state ═════════════ */
const freshState = () => ({ v: 1, items: {}, hints: {}, names: {}, prefs: { pace: "savor", names: "current" }, prefsT: 0 });
let S = freshState();

function loadLocal() {
  const raw = lsGet(LS_KEY);
  if (!raw) return;
  try { S = normalize(JSON.parse(raw)); } catch { /* keep fresh */ }
}
function normalize(x) {
  const s = freshState();
  if (!x || typeof x !== "object") return s;
  s.items = x.items && typeof x.items === "object" ? x.items : {};
  s.hints = x.hints && typeof x.hints === "object" ? x.hints : {};
  s.names = x.names && typeof x.names === "object" ? x.names : {};
  s.prefs = Object.assign(s.prefs, x.prefs || {});
  s.prefsT = x.prefsT || 0;
  return s;
}
function migrateIds() {
  for (const a of ACTS) for (const old of a.formerIds || []) {
    for (const bucket of ["items", "hints", "names"]) {
      if (S[bucket][old] && !S[bucket][a.id]) S[bucket][a.id] = S[bucket][old];
    }
  }
}
function persist() {
  lsSet(LS_KEY, JSON.stringify(S));
  Sync.schedule();
}

/* Merge two progress states: per-entry latest timestamp wins. Unknown ids are kept. */
function mergeStates(a, b) {
  if (!b) return a;
  const out = freshState();
  for (const bucket of ["items", "hints", "names"]) {
    const A = a[bucket] || {}, B = b[bucket] || {};
    for (const k of new Set([...Object.keys(A), ...Object.keys(B)])) {
      const x = A[k], y = B[k];
      out[bucket][k] = !x ? y : !y ? x : ((y.t || 0) > (x.t || 0) ? y : x);
    }
  }
  if ((b.prefsT || 0) > (a.prefsT || 0)) { out.prefs = Object.assign(freshState().prefs, b.prefs); out.prefsT = b.prefsT; }
  else { out.prefs = Object.assign(freshState().prefs, a.prefs); out.prefsT = a.prefsT || 0; }
  return out;
}

/* Cross-device sync through the artifact's private per-viewer store, when the viewer provides one. */
const Sync = {
  ref: null, mode: "local", timer: null, chain: Promise.resolve(), lastRemote: null,
  async start() {
    try {
      if (!window.claude || typeof window.claude.use !== "function") return;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      this.ref = db.collection("data/users/" + uid).doc("journal");
      this.mode = "connecting"; renderChrome();
      const loadTimer = setTimeout(() => { if (this.mode === "connecting") { this.mode = "offline"; renderChrome(); } }, 10000);
      this.ref.onSnapshot((snap) => {
        if (snap.metadata && snap.metadata.hasPendingWrites) return;
        const remote = snap.exists ? normalize(snap.data()) : null;
        if (!snap.metadata || !snap.metadata.fromCache) { clearTimeout(loadTimer); this.mode = "on"; }
        this.lastRemote = remote ? stable(remote) : null;
        const merged = mergeStates(S, remote);
        const changed = stable(merged) !== stable(S);
        S = merged;
        lsSet(LS_KEY, JSON.stringify(S));
        if (changed) render();
        else renderChrome();
        // Write back only when this device holds changes the store lacks; never just because the page opened.
        const hasLocal = Object.keys(S.items).length || Object.keys(S.hints).length || Object.keys(S.names).length || S.prefsT;
        if (this.mode === "on" && (remote ? stable(S) !== this.lastRemote : hasLocal)) this.schedule(400);
      }, () => { clearTimeout(loadTimer); this.mode = "offline"; renderChrome(); });
    } catch { this.mode = "local"; }
  },
  schedule(delay = 1200) {
    if (!this.ref) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), delay);
  },
  flush() {
    if (!this.ref) return;
    const body = JSON.parse(JSON.stringify(S));
    const key = stable(body);
    if (key === this.lastRemote) return;
    this.chain = this.chain.then(() => this.ref.set(body)).then(() => { this.lastRemote = key; this.mode = "on"; renderChrome(); })
      .catch((e) => { this.mode = e && e.code === "invalid_argument" ? "local" : "offline"; renderChrome(); });
  },
};

/* ═════════════ Derived status ═════════════ */
const stored = (id) => (S.items[id] && S.items[id].s) || "todo";
const isResolved = (id) => { const s = stored(id); return s === "done" || s === "skipped"; };
const prereqsMet = (a) => (a.prerequisites || []).every((p) => !BY_ID.has(p) || isResolved(p));
function isMissed(a) {
  const m = a.missable;
  if (!m || !m.locksAt || isResolved(a.id)) return false;
  return stored(m.locksAt) === "done";
}
function statusOf(a) {
  const s = stored(a.id);
  if (s === "done" || s === "skipped") return s;
  if (isMissed(a)) return "missed";
  if (s === "deferred") return "deferred";
  if (!prereqsMet(a)) return "locked";
  return "todo";
}
const isOpen = (a) => statusOf(a) === "todo";
function nextMain() { return ORDERED.find((a) => a.category === "story" && !isResolved(a.id)) || null; }
function currentChapterIdx() { const m = nextMain(); return m ? CH_IDX.get(m.chapter) : CH_IDX.get("post") ?? CHAPTERS.length - 1; }
const chapterIdx = (a) => CH_IDX.get(a.chapter);
const chapterOf = (a) => CHAPTERS[chapterIdx(a)];

function showName(a) {
  if (a.category !== "story") return true;
  if (S.prefs.names === "always") return true;
  if (S.names[a.id] && S.names[a.id].r) return true;
  return chapterIdx(a) <= currentChapterIdx();
}
function displayTitle(a) {
  if (a.category !== "story") return a.title;
  return showName(a) ? a.missionName : a.safeTitle;
}
const labelFor = (id) => { const a = BY_ID.get(id); return a ? displayTitle(a) : id; };

function chapterStats(cid) {
  const list = ACTS.filter((a) => a.chapter === cid);
  let done = 0, skipped = 0, missed = 0, open = 0;
  for (const a of list) {
    const s = statusOf(a);
    if (s === "done") done++; else if (s === "skipped") skipped++; else if (s === "missed") missed++; else open++;
  }
  const denom = list.length - skipped;
  return { total: list.length, done, skipped, missed, open, pct: pct(done, denom) };
}
function overallStats() {
  let done = 0, skipped = 0;
  for (const a of ACTS) { const s = stored(a.id); if (s === "done") done++; else if (s === "skipped") skipped++; }
  return { done, skipped, total: ACTS.length, pct: pct(done, ACTS.length - skipped) };
}

/* ═════════════ Recommendation engine ═════════════ */
function recommendations() {
  const cur = currentChapterIdx();
  const curId = CHAPTERS[cur].id;
  const allowed = new Set(PACES[S.prefs.pace]?.priorities || PACES.savor.priorities);
  const eligible = (a) => isOpen(a) && !a.duringMission && !a.ambient && chapterIdx(a) <= cur;
  const nm = nextMain();
  const urgent = ORDERED.filter((a) => eligible(a) && a.missable && a.missable.hourglass);
  const gated = nm ? ORDERED.filter((a) => eligible(a) && a.missable && a.missable.locksAt === nm.id && a.missable.type !== "in-mission") : [];
  const walk = ORDERED.filter((a) => eligible(a) && a.chapter === curId && (a.category === "story" || allowed.has(a.priority)));
  const seen = new Set(); const out = [];
  for (const a of [...urgent, ...gated, ...walk]) if (!seen.has(a.id)) { seen.add(a.id); out.push(a); }
  return out;
}
function reasonFor(a, nm) {
  if (a.missable && a.missable.hourglass) return "Timed mission. It can expire, so it jumps the queue.";
  if (nm && a.missable && a.missable.locksAt === nm.id) return "Your next story mission closes this for good.";
  return a.whyNow || a.spoilerFreeDescription;
}
function lostAtMission(m) {
  if (!m) return [];
  return ACTS.filter((a) => a.missable && a.missable.locksAt === m.id && a.missable.type !== "in-mission" && !isResolved(a.id) && statusOf(a) !== "missed");
}
function ambientNow() {
  const cur = currentChapterIdx();
  return ORDERED.filter((a) => a.ambient && isOpen(a) && chapterIdx(a) <= cur);
}
function earlierLeftovers() {
  const cur = currentChapterIdx();
  return ORDERED.filter((a) => chapterIdx(a) < cur && !a.ambient && !a.duringMission && isOpen(a) && a.category !== "story");
}

/* ═════════════ UI state ═════════════ */
const UI = Object.assign({ view: "now", chapter: null, q: "", filters: defaultFilters(), heroOpen: false }, (() => {
  try { const u = JSON.parse(lsGet(UI_KEY) || "{}"); return { filters: Object.assign(defaultFilters(), u.filters || {}) }; } catch { return {}; }
})());
UI.expanded = new Set();
function defaultFilters() { return { pri: [], cat: [], status: "all", missable: false, available: false, character: "any", verif: "any" }; }
function saveUI() { lsSet(UI_KEY, JSON.stringify({ filters: UI.filters })); }
function activeFilterCount() {
  const f = UI.filters; let n = f.pri.length + f.cat.length;
  if (f.status !== "all") n++; if (f.missable) n++; if (f.available) n++; if (f.character !== "any") n++; if (f.verif !== "any") n++;
  return n;
}

/* ═════════════ Actions ═════════════ */
let undoTimer = null;
function setStatus(id, s, { toast = true } = {}) {
  const prev = S.items[id] ? Object.assign({}, S.items[id]) : null;
  S.items[id] = { s, t: now() };
  persist();
  render();
  if (toast) {
    const a = BY_ID.get(id);
    const lost = a && a.category === "story" && s === "done" ? ACTS.filter((x) => x.missable && x.missable.locksAt === id && statusOf(x) === "missed").length : 0;
    const msg = (s === "done" ? "Marked done" : s === "skipped" ? "Skipped" : s === "deferred" ? "Saved for later" : "Moved back to to-do")
      + (lost ? ` · ${lost} item${lost > 1 ? "s" : ""} now missed` : "");
    showToast(msg, () => { if (prev) S.items[id] = Object.assign(prev, { t: now() }); else S.items[id] = { s: "todo", t: now() }; persist(); render(); });
  }
}
function toggleDone(id) { setStatus(id, stored(id) === "done" ? "todo" : "done"); }
function revealHint(id) {
  const cur = (S.hints[id] && S.hints[id].l) || 0;
  S.hints[id] = { l: Math.min(4, cur + 1), t: now() };
  persist(); render();
}
function hideHints(id) { S.hints[id] = { l: 0, t: now() }; persist(); render(); }
function revealName(id) { S.names[id] = { r: 1, t: now() }; persist(); render(); }
function setPref(k, v) { S.prefs[k] = v; S.prefsT = now(); persist(); render(); }

function showToast(msg, undo) {
  clearTimeout(undoTimer);
  const root = $("#toastRoot");
  root.innerHTML = `<div class="toast ${undo ? "" : "solo"}" role="status"><span>${esc(msg)}</span>${undo ? '<button data-action="undo">Undo</button>' : ""}</div>`;
  showToast.undo = undo || null;
  undoTimer = setTimeout(() => { root.innerHTML = ""; showToast.undo = null; }, undo ? 5000 : 2600);
}

/* ═════════════ Render: pieces ═════════════ */
function verifBadge(a, withText = false) {
  const v = a.verificationStatus || "unconfirmed";
  const label = v === "verified" ? "Verified" : v === "community" ? "Community-reported" : "Unconfirmed";
  return `<span class="verif v-${v}" title="${esc(label + ": " + (DATA.meta.verificationLegend[v] || ""))}">${ICON[v] || ""}${withText ? esc(label) : ""}</span>`;
}
function priorityChip(a) {
  if (a.category === "story") return "";
  const p = DATA.taxonomy.priorities[a.priority];
  return `<span class="chip p-${a.priority}"><i class="dot"></i>${esc(p ? p.label : a.priority)}</span>`;
}
function missChip(a) {
  const m = a.missable; if (!m) return "";
  if (m.hourglass || m.type === "timed") return `<span class="chip timed">${ICON.hourglass}${m.hourglass ? "Timed · do it now" : "Time-limited"}</span>`;
  if (m.type === "temporary") return `<span class="chip timed">${ICON.clock}Temporarily missable</span>`;
  if (m.type === "in-mission") return `<span class="chip miss">${ICON.warn}During mission only</span>`;
  const when = m.locksAt ? "before " + labelFor(m.locksAt) : (m.latestSafe || "");
  return `<span class="chip miss">${ICON.warn}Missable${when ? " · " + esc(when) : ""}</span>`;
}
function statusChip(st) {
  if (st === "deferred") return `<span class="chip st-deferred">${ICON.clock}Later</span>`;
  if (st === "skipped") return `<span class="chip st-skipped">Skipped</span>`;
  if (st === "missed") return `<span class="chip st-missed">${ICON.x}Missed</span>`;
  if (st === "locked") return `<span class="chip st-locked">${ICON.lock}Not yet available</span>`;
  return "";
}
function teaserChip(a) {
  if (!a.rewardTeaser) return "";
  const plain = !a.uniqueReward && !["Rare discovery", "Memorable encounter", "Unique reward available"].includes(a.rewardTeaser);
  return `<span class="chip teaser ${plain ? "plain" : ""}">${a.uniqueReward ? ICON.spark : ""}${esc(a.rewardTeaser)}</span>`;
}
function charChip(a) {
  if (!a.character || a.character === "Either") return "";
  return `<span class="chip">${ICON.person}${esc(CHAR_SHORT[a.character] || a.character)}</span>`;
}
function eyebrow(a) {
  const cat = DATA.taxonomy.categories[a.category] || a.category;
  const bits = [cat];
  if (a.region) bits.push(a.region);
  return bits.map(esc).join(" · ");
}
function checkIcon(st) {
  return st === "done" ? ICON.check : st === "skipped" ? ICON.skip : st === "deferred" ? ICON.clock : st === "missed" ? ICON.x : ICON.check;
}

function cardHTML(a, opts = {}) {
  const st = statusOf(a);
  const open = UI.expanded.has(a.id);
  const title = displayTitle(a);
  const nameHidden = a.category === "story" && !showName(a);
  const chips = [
    a.category === "story" && a.marker && showName(a) ? `<span class="chip">Marker: ${esc(a.marker)}</span>` : "",
    statusChip(st), missChip(a), priorityChip(a), teaserChip(a), charChip(a),
    a.timeOfDay ? `<span class="chip">${ICON.moon}${esc(a.timeOfDay)}</span>` : "",
    a.edition ? `<span class="chip">${esc(a.edition)}</span>` : "",
    (DURING.get(a.id) || []).length ? `<span class="chip miss">${ICON.warn}${DURING.get(a.id).length} one-time pickup inside</span>` : "",
    verifBadge(a),
  ].join("");
  return `<article class="card s-${st} cat-${a.category} ${open ? "is-open" : ""}" id="card-${esc(a.id)}">
    <div class="card-row">
      <button class="check" data-action="toggle" data-id="${esc(a.id)}" aria-pressed="${st === "done"}" aria-label="${st === "done" ? "Mark not done" : "Mark done"}: ${esc(title)}">${checkIcon(st)}</button>
      <button class="card-main" data-action="expand" data-id="${esc(a.id)}" aria-expanded="${open}">
        <span class="card-eyebrow">${opts.showChapter ? esc(chapterOf(a).title) + " · " : ""}${eyebrow(a)}</span>
        <span class="card-title">${esc(title)}${nameHidden ? ' <span class="muted small" style="font-family:var(--font-body)">(name hidden)</span>' : ""}</span>
        <span class="chips">${chips}</span>
      </button>
    </div>
    ${open ? `<div class="card-body">${bodyHTML(a)}</div>` : ""}
  </article>`;
}

function missBoxHTML(a) {
  const m = a.missable; if (!m) return "";
  const typeLabel = (DATA.taxonomy.missableTypes[m.type] || m.type);
  const latest = m.locksAt ? "Before starting " + labelFor(m.locksAt) : (m.latestSafe || "Not documented");
  const affects = m.affects100 === true ? "Yes" : m.affects100 === false ? "No" : "Not documented";
  return `<div class="missbox ${m.type === "temporary" ? "temporary" : ""}">
    <div class="missbox-head">${m.hourglass ? ICON.hourglass : ICON.warn}<span>${m.hourglass ? "Timed and missable" : "Missable"} · ${esc(typeLabel)}</span></div>
    ${m.warning ? `<p>${esc(m.warning)}</p>` : ""}
    <dl class="kv">
      <dt>Earliest</dt><dd>${esc(m.earliest || "Not documented")}</dd>
      <dt>Latest safe</dt><dd>${esc(latest)}</dd>
      <dt>Character</dt><dd>${esc(CHAR_SHORT[a.character] || a.character || "Either")}</dd>
      <dt>Affects 100%</dt><dd>${affects}</dd>
      <dt>Unique reward</dt><dd>${m.uniqueReward || a.uniqueReward ? "Yes" : "No or not documented"}</dd>
      ${m.returns ? `<dt>Returns</dt><dd>${esc(m.returns)}</dd>` : ""}
    </dl>
  </div>`;
}

function hintsHTML(a) {
  if (!a.hints || !a.hints.length) return "";
  const lvl = Math.min(4, (S.hints[a.id] && S.hints[a.id].l) || 0);
  const steps = [1, 2, 3, 4].map((n) => `<i class="${n <= lvl ? "on" : ""}"></i>`).join("");
  const shown = a.hints.slice(0, lvl).map((h, i) => `<div class="hint l${i + 1}"><span class="hint-n">${i + 1}</span><div><span class="hint-label">${HINT_LABELS[i]}</span><p>${esc(h)}</p></div></div>`).join("");
  const kind = lvl >= 2 && a.rewardCategory ? `<p class="muted small">Reward type: ${esc(DATA.taxonomy.rewardCategories[a.rewardCategory] || a.rewardCategory)}</p>` : "";
  const nextBtn = lvl < 4
    ? `<button class="btn btn-sm ${lvl === 0 ? "" : "btn-ghost"}" data-action="hint" data-id="${esc(a.id)}">Reveal hint ${lvl + 1} · ${HINT_LABELS[lvl]}</button>` : "";
  const hideBtn = lvl > 0 ? `<button class="btn btn-sm btn-ghost" data-action="hide-hints" data-id="${esc(a.id)}">Hide hints</button>` : "";
  return `<div class="hints">
    <div class="hints-head"><span class="eyebrow">Hints${lvl ? " · level " + lvl + " of 4" : ""}</span><span class="hint-steps" aria-hidden="true">${steps}</span></div>
    ${lvl === 0 ? `<p class="hint-locked">Hidden. Each level reveals a little more, and only when you ask.</p>` : shown}
    ${kind}
    <div class="actions">${nextBtn}${hideBtn}</div>
  </div>`;
}

function bodyHTML(a) {
  const st = statusOf(a);
  const parts = [];
  if (a.category === "story" && !showName(a)) {
    parts.push(`<p class="muted small">Mission name hidden because it's ahead of where you are. <button class="name-reveal" data-action="reveal-name" data-id="${esc(a.id)}">Show the name</button></p>`);
  }
  parts.push(`<p class="desc">${esc(a.spoilerFreeDescription)}</p>`);
  if (a.whyNow) parts.push(`<p class="why"><b>Why now:</b> ${esc(a.whyNow)}</p>`);
  if (a.unlocks && a.unlocks.length) parts.push(`<div><span class="eyebrow">Unlocks</span><ul class="unlocks">${a.unlocks.map((u) => `<li>${esc(u)}</li>`).join("")}</ul></div>`);
  if (a.missable) parts.push(missBoxHTML(a));
  const during = DURING.get(a.id) || [];
  if (during.length) parts.push(`<div class="during"><span class="eyebrow">During this mission</span>${during.map((d) => cardHTML(d)).join("")}</div>`);
  if (st === "locked") {
    const needs = (a.prerequisites || []).filter((p) => !isResolved(p));
    parts.push(`<p class="muted small">${ICON.lock.replace("<svg", '<svg style="width:14px;height:14px;vertical-align:-2px"')} Available after: ${needs.map((p) => esc(labelFor(p))).join(", ")}</p>`);
  }
  parts.push(hintsHTML(a));
  // Details
  const det = [];
  const pre = (a.prerequisites || []).filter((p) => BY_ID.has(p));
  det.push(`<dl class="kv">
    <dt>Chapter</dt><dd>${esc(chapterOf(a).title)}</dd>
    <dt>Order</dt><dd>${esc(a.recommendedOrder)}</dd>
    ${pre.length ? `<dt>Needs</dt><dd>${pre.map((p) => esc(labelFor(p)) + (isResolved(p) ? " ✓" : "")).join(", ")}</dd>` : ""}
    <dt>Character</dt><dd>${esc(CHAR_SHORT[a.character] || a.character || "Either")}</dd>
    ${a.trophy ? `<dt>Trophy</dt><dd>${esc(a.trophy)}</dd>` : ""}
    <dt>For 100%</dt><dd>${a.requiredFor100Percent ? "Counts toward 100%" : "Not required"}</dd>
    <dt>Research</dt><dd>${verifBadge(a, true)} · checked ${esc(a.lastVerified || "")}</dd>
  </dl>`);
  if (a.notes) det.push(`<p class="small muted">${esc(a.notes)}</p>`);
  if (a.sources && a.sources.length) det.push(`<ul class="sources">${a.sources.map((k) => {
    const s = DATA.sources[k]; if (!s) return "";
    const isUrl = /^https?:/.test(s.url);
    return `<li>${isUrl ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>` : esc(s.name)}${s.published ? ` <span>(${esc(s.published)})</span>` : ""}</li>`;
  }).join("")}</ul>`);
  parts.push(`<details class="more"><summary>Details, sources and spoiler notes</summary><div>${det.join("")}</div></details>`);
  // Actions
  const act = [];
  if (st !== "done") act.push(`<button class="btn btn-sm" data-action="status" data-s="done" data-id="${esc(a.id)}">${ICON.check}Done</button>`);
  if (st !== "deferred" && st !== "done" && st !== "skipped") act.push(`<button class="btn btn-sm btn-ghost" data-action="status" data-s="deferred" data-id="${esc(a.id)}">${ICON.clock}Later</button>`);
  if (st !== "skipped" && st !== "done") act.push(`<button class="btn btn-sm btn-ghost" data-action="status" data-s="skipped" data-id="${esc(a.id)}">Skip</button>`);
  if (stored(a.id) !== "todo") act.push(`<button class="btn btn-sm btn-ghost" data-action="status" data-s="todo" data-id="${esc(a.id)}">Reset</button>`);
  parts.push(`<div class="actions">${act.join("")}</div>`);
  return parts.join("");
}

function gateHTML(m) {
  const g = m.gate; if (!g) return "";
  const open = lostAtMission(m);
  const done = isResolved(m.id);
  return `<section class="gate ${g.severity === "soft" ? "soft" : ""}">
    <div class="gate-eyebrow">${ICON.warn}${g.kind === "choice" ? "Save before you choose" : g.severity === "soft" ? "Heads up before the next mission" : "Point of no return"}${done ? " · passed" : ""}</div>
    <h3>${esc(g.title)}</h3>
    <p>${esc(g.warning)}</p>
    <div class="gate-cols">
      ${g.lose && g.lose.length ? `<div><h4>Won't carry over</h4><ul>${g.lose.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
      ${g.keep && g.keep.length ? `<div><h4>Carries over</h4><ul>${g.keep.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
    </div>
    ${!done && open.length ? `<div class="list"><span class="eyebrow" style="color:var(--danger)">Still open · lost when this mission starts</span>${open.map((x) => miniRow(x)).join("")}</div>` : ""}
    ${!done && !open.length && g.kind !== "choice" ? `<p class="small" style="color:var(--teal)">Everything tracked here is handled.</p>` : ""}
    ${g.save ? `<p class="gate-save">${ICON.save}<span>${esc(g.save)}</span></p>` : ""}
  </section>`;
}
function miniRow(a, sub) {
  return `<button class="mini-row" data-action="goto" data-id="${esc(a.id)}"><span class="t">${esc(displayTitle(a))}<small>${esc(sub || (chapterOf(a).title + " · " + (a.region || "")))}</small></span>${ICON.chev}</button>`;
}

/* ═════════════ Views ═════════════ */
function viewNow() {
  const cur = currentChapterIdx();
  const ch = CHAPTERS[cur];
  const stats = chapterStats(ch.id);
  const recs = recommendations();
  const nm = nextMain();
  const hero = recs[0];
  const pace = S.prefs.pace;
  let h = `<section class="banner-hero" data-enter>${bannerHTML(ch.id)}<div class="wrap"><div class="chapter-hero on-banner hero-text">
    <span class="eyebrow">${ch.number === 0 ? "Prologue" : ch.postGame ? "Free roam" : "Chapter " + ch.number} · ${esc(ch.base)} · ${esc(ch.protagonists.join(" & "))}</span>
    <h1>${esc(ch.title)}</h1>
    <div class="progress-line"><div class="bar"><i style="width:${stats.pct}%"></i></div><span class="num">${stats.done} of ${stats.total - stats.skipped} · ${stats.pct}%</span></div>
  </div></div></section><section class="board"><div class="wrap">`;
  // Two columns on desktop (main: what next and what else; side: will I miss anything, pace).
  // On phones the columns dissolve and the "o" classes keep the order: next, miss check, pace, then the rest.
  const main = [], side = [];

  // Q1 + Q2: what next, and why
  if (hero) {
    const open = UI.heroOpen;
    const during = DURING.get(hero.id) || [];
    main.push(`<section class="section o1"><div class="next">
      <span class="next-q">What should I do next?</span>
      <span class="card-eyebrow">${eyebrow(hero)}</span>
      <h2>${esc(displayTitle(hero))}</h2>
      <div class="chips">${[missChip(hero), priorityChip(hero), teaserChip(hero), charChip(hero), hero.timeOfDay ? `<span class="chip">${ICON.moon}${esc(hero.timeOfDay)}</span>` : "", verifBadge(hero)].join("")}</div>
      <p class="why"><b>Why it's worth doing now:</b> ${esc(reasonFor(hero, nm))}</p>
      ${hero.category === "story" || hero.whyNow ? `<p class="small" style="color:var(--ink-2)">${esc(hero.spoilerFreeDescription)}</p>` : ""}
      ${during.length ? `<div class="missbox"><div class="missbox-head">${ICON.warn}<span>${during.length} one-time pickup${during.length > 1 ? "s" : ""} inside this mission</span></div>${during.map((d) => `<p class="small">${esc(d.spoilerFreeDescription)}</p>`).join("")}<p class="small muted">Open the hints if you want a nudge before you start.</p></div>` : ""}
      <div class="next-actions">
        <button class="btn btn-primary" data-action="status" data-s="done" data-id="${esc(hero.id)}">${ICON.check}Done</button>
        <button class="btn" data-action="status" data-s="deferred" data-id="${esc(hero.id)}">Later</button>
        <button class="btn" data-action="status" data-s="skipped" data-id="${esc(hero.id)}">Skip</button>
        <button class="btn" data-action="hero-toggle" aria-expanded="${open}">${open ? "Less" : "Hints"}</button>
      </div>
      ${open ? `<div class="card-body" style="padding:14px 0 0;border-color:var(--line-strong)">${bodyHTML(hero)}</div>` : ""}
    </div></section>`);
  } else {
    main.push(`<section class="section o1"><div class="next"><span class="next-q">What should I do next?</span><h2>You're all caught up</h2><p class="why">Nothing open at your current pace. Try a wider pace, or check items you saved for later.</p></div></section>`);
  }

  // Q3: will I miss anything?
  if (nm) {
    const lost = lostAtMission(nm);
    const gate = nm.gate;
    const warn = lost.length > 0 || (gate && gate.severity === "hard");
    const during = DURING.get(nm.id) || [];
    side.push(`<section class="section o2"><div class="gatecheck ${warn ? "warn" : "ok"}">
      <span class="q-label"><span class="eyebrow">Will I miss anything if I advance the story?</span></span>
      <h3>Next story mission: ${esc(displayTitle(nm))}${nm.marker && showName(nm) ? ` <span class="muted small" style="font-weight:500;font-family:var(--font-body)">(${esc(nm.marker)})</span>` : ""}</h3>
      ${lost.length ? `<div class="verdict">${ICON.warn}<span>Yes. Finish ${lost.length === 1 ? "this" : "these " + lost.length} first. Starting it closes ${lost.length === 1 ? "it" : "them"} for good.</span></div><div class="list">${lost.map((a) => miniRow(a, firstSentence(a.missable.warning))).join("")}</div>`
        : gate && gate.severity === "hard" ? `<div class="verdict">${ICON.warn}<span>Nothing tracked is still open, but this is a point of no return.</span></div>`
        : `<div class="verdict">${ICON.shield}<span>Safe to continue. Nothing known is lost when you start it.</span></div>`}
      ${gate ? `<p class="small">${esc(gate.warning)}</p>${gate.save ? `<p class="gate-save">${ICON.save}<span>${esc(gate.save)}</span></p>` : ""}` : ""}
      ${during.length ? `<p class="small muted">${during.length} one-time pickup${during.length > 1 ? "s" : ""} happen${during.length > 1 ? "" : "s"} inside this mission. Check its card before you start.</p>` : ""}
    </div></section>`);
  }

  side.push(`<section class="section o3" aria-label="Pace"><div class="section-head"><h2 class="section-title">Your pace</h2></div><div class="pace" role="group" aria-label="Choose your pace">${Object.entries(PACES).map(([k, p]) => `<button data-action="pace" data-pace="${k}" aria-pressed="${k === pace}">${esc(p.label)}</button>`).join("")}</div><p class="small muted">${esc(PACES[pace].blurb)} ${esc(ch.intro)}</p></section>`);

  // Also available
  const lostIds = new Set(lostAtMission(nm).map((a) => a.id));
  const more = recs.slice(1).filter((a) => !lostIds.has(a.id)).slice(0, 5);
  if (more.length) {
    main.push(`<section class="section o4"><div class="section-head"><h2 class="section-title">Also open right now</h2><button class="btn btn-sm btn-ghost" data-action="nav" data-view="journal">Full journal</button></div><div class="list">${more.map((a) => cardHTML(a)).join("")}</div></section>`);
  }
  const amb = ambientNow();
  if (amb.length) {
    main.push(`<section class="section o5"><div class="section-head"><h2 class="section-title">Keep in mind as you play</h2></div><p class="small muted">Habits and chance encounters. They never block the story.</p><div class="list">${amb.slice(0, 4).map((a) => cardHTML(a)).join("")}</div></section>`);
  }
  const left = earlierLeftovers();
  const deferred = ORDERED.filter((a) => statusOf(a) === "deferred");
  if (left.length || deferred.length) {
    side.push(`<section class="section o6"><div class="list">
      ${left.length ? `<button class="mini-row" data-action="filter-open-earlier"><span class="t">${left.length} still open from earlier chapters<small>Optional finds you passed. None are urgent.</small></span>${ICON.chev}</button>` : ""}
      ${deferred.length ? `<button class="mini-row" data-action="filter-deferred"><span class="t">${deferred.length} saved for later<small>Things you chose to come back to.</small></span>${ICON.chev}</button>` : ""}
    </div></section>`);
  }
  h += `<div class="now-grid"><div class="col col-main">${main.join("")}</div><div class="col col-side">${side.join("")}</div></div>`;
  h += footHTML();
  h += `</div></section>`;
  return h;
}

function filterMatch(a) {
  const f = UI.filters;
  if (f.pri.length && !(a.category === "story" ? f.pri.includes("story") : f.pri.includes(a.priority))) return false;
  if (f.cat.length && !f.cat.includes(a.category)) return false;
  const st = statusOf(a);
  if (f.status === "todo" && !(st === "todo" || st === "locked")) return false;
  if (f.status !== "all" && f.status !== "todo" && st !== f.status) return false;
  if (f.missable && !a.missable) return false;
  if (f.available && st !== "todo") return false;
  if (f.character !== "any" && !(a.character === f.character || a.character === "Both" || a.character === "Either")) return false;
  if (f.verif !== "any" && a.verificationStatus !== f.verif) return false;
  return true;
}
function searchMatch(a, q) {
  const hay = [displayTitle(a), a.category === "story" && showName(a) ? a.marker : "", a.region, a.spoilerFreeDescription, a.rewardTeaser, DATA.taxonomy.categories[a.category], a.character].join(" ").toLowerCase();
  return q.split(/\s+/).filter(Boolean).every((w) => hay.includes(w));
}

function viewJournal() {
  const cur = currentChapterIdx();
  if (UI.chapter == null || !CH_IDX.has(UI.chapter)) UI.chapter = CHAPTERS[cur].id;
  const q = UI.q.trim().toLowerCase();
  const nf = activeFilterCount();
  let h = `<div class="wrap">`;
  h += `<div class="chapter-tabs" role="group" aria-label="Chapters">${CHAPTERS.map((c, i) => {
    const s = chapterStats(c.id);
    return `<button class="ctab" data-action="chapter" data-ch="${c.id}" aria-pressed="${!q && UI.chapter === c.id}">${thumbHTML(c.id, false)}<span class="meta">
      <span class="n"><span>${c.number === 0 ? "Prologue" : c.postGame ? "Post-game" : "Ch " + c.number}</span>${i === cur ? '<span class="here">Here</span>' : `<span>${s.pct}%</span>`}</span>
      <span class="tt">${esc(c.title)}</span><span class="bar"><i style="width:${s.pct}%"></i></span></span></button>`;
  }).join("")}</div>`;
  h += `<div class="toolbar">
    <label class="search">${ICON.search}<input id="q" type="search" placeholder="Search titles, regions, characters" value="${esc(UI.q)}" autocomplete="off" aria-label="Search the journal">${UI.q ? '<button class="clear" data-action="clear-search" aria-label="Clear search">' + ICON.x + "</button>" : ""}</label>
    <button class="icon-btn filter-btn" data-action="open-filters" aria-label="Filters">${ICON.filter}${nf ? `<span class="count">${nf}</span>` : ""}</button>
  </div>`;

  if (q) {
    const res = ORDERED.filter((a) => !a.duringMission && searchMatch(a, q) && filterMatch(a));
    h += `<div class="chapter-head"><span class="eyebrow">Search · ${res.length} result${res.length === 1 ? "" : "s"} across all chapters</span></div>`;
    h += res.length ? `<div class="list">${res.map((a) => cardHTML(a, { showChapter: true })).join("")}</div>` : `<div class="empty">Nothing matches “${esc(UI.q)}”${nf ? " with your filters" : ""}.</div>`;
  } else {
    const ch = CHAPTERS[CH_IDX.get(UI.chapter)];
    const s = chapterStats(ch.id);
    const list = ORDERED.filter((a) => a.chapter === ch.id && !a.duringMission);
    const shown = list.filter(filterMatch);
    h += `<div class="chapter-head">
      <span class="eyebrow">${ch.number === 0 ? "Prologue" : ch.postGame ? "Post-game" : "Chapter " + ch.number} · ${esc(ch.base)}</span>
      <h2>${esc(ch.title)}</h2>
      <p class="small" style="color:var(--ink-2)">${esc(ch.intro)}</p>
      <div class="stats"><span>${s.done} done</span><span>${s.open} open</span>${s.skipped ? `<span>${s.skipped} skipped</span>` : ""}${s.missed ? `<span style="color:var(--danger)">${s.missed} missed</span>` : ""}<span>${s.pct}%</span></div>
      ${ch.id !== "post" && ch.id !== "prologue" ? `<p class="small muted">${esc(DATA.meta.orderNote)}</p>` : ""}
    </div>`;
    if (!shown.length) h += `<div class="empty">No steps match your filters in this chapter.${nf ? ' <button class="name-reveal" data-action="reset-filters">Clear filters</button>' : ""}</div>`;
    else {
      h += `<div class="list">`;
      for (const a of shown) {
        if (a.gate && !nf) h += gateHTML(a);
        h += cardHTML(a);
      }
      h += `</div>`;
    }
  }
  h += footHTML() + `</div>`;
  return h;
}

function viewMissables() {
  const cur = currentChapterIdx();
  const all = ORDERED.filter((a) => a.missable);
  const open = all.filter((a) => ["todo", "locked", "deferred"].includes(statusOf(a)));
  const missed = all.filter((a) => statusOf(a) === "missed");
  const handled = all.filter((a) => isResolved(a.id));
  let h = `<div class="wrap"><section class="chapter-hero">
    <span class="eyebrow">Missables and points of no return</span>
    <h1>Don't leave these behind</h1>
    <p class="intro">Everything research says can be lost, in story order. Warnings here are more direct than the exploration hints because missing something for good is worse than a small spoiler. Exact rewards stay behind the hint levels.</p>
  </section>
  <div class="stat-grid" style="margin-top:18px">
    <div class="stat"><b>${open.length}</b><span>Still open</span></div>
    <div class="stat"><b>${handled.length}</b><span>Done or skipped</span></div>
    <div class="stat"><b style="color:${missed.length ? "var(--danger)" : "inherit"}">${missed.length}</b><span>Missed</span></div>
    <div class="stat"><b>${all.length}</b><span>Tracked in total</span></div>
  </div>`;
  // group by lock mission
  const groups = new Map();
  for (const a of all) {
    const key = a.missable.locksAt || (a.missable.type === "timed" ? "__timed_" + a.chapter : "__other_" + a.chapter);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(a);
  }
  const keys = [...groups.keys()].sort((x, y) => {
    const ax = BY_ID.get(x) || groups.get(x)[0], ay = BY_ID.get(y) || groups.get(y)[0];
    return (chapterIdx(ax) - chapterIdx(ay)) || (ax.recommendedOrder - ay.recommendedOrder);
  });
  for (const k of keys) {
    const items = groups.get(k);
    const m = BY_ID.get(k);
    const first = items[0];
    const chTitle = chapterOf(m || first).title;
    let label;
    if (m && items.every((a) => a.missable.type === "in-mission")) label = "Inside " + displayTitle(m);
    else if (m) label = "Before starting " + displayTitle(m);
    else if (k.startsWith("__timed_")) label = "Time-limited when they appear";
    else label = "Other risks";
    const ahead = chapterIdx(m || first) > cur;
    h += `<section class="section"><div class="section-head"><h2 class="section-title">${esc(label)}</h2><span class="eyebrow">${esc(chTitle)}${ahead ? " · ahead" : ""}</span></div>
      ${m && m.gate ? `<p class="small muted">${esc(m.gate.warning)}</p>` : ""}
      <div class="list">${items.map((a) => cardHTML(a)).join("")}</div></section>`;
  }
  h += footHTML() + `</div>`;
  return h;
}

function viewProgress() {
  const o = overallStats();
  const all = ACTS;
  const by = (pred) => all.filter(pred);
  const uniques = by((a) => a.uniqueReward);
  const uDone = uniques.filter((a) => stored(a.id) === "done").length;
  const story = by((a) => a.category === "story");
  const sDone = story.filter((a) => stored(a.id) === "done").length;
  const miss = by((a) => a.missable);
  const mMissed = miss.filter((a) => statusOf(a) === "missed").length;
  const syncLabel = Sync.mode === "on" ? "Synced across your devices" : Sync.mode === "connecting" ? "Connecting to sync…" : Sync.mode === "offline" ? "Sync unavailable right now · saved on this device" : "Saved on this device";
  let h = `<div class="wrap"><section class="chapter-hero">
    <span class="eyebrow">Your journey so far</span>
    <h1>${o.pct}% of the journal</h1>
    <p class="intro">${o.done} of ${o.total - o.skipped} steps done${o.skipped ? `, ${o.skipped} skipped` : ""}. This counts the guide's steps, not the in-game 100% screen.</p>
    <span class="sync ${Sync.mode === "on" ? "on" : Sync.mode === "offline" ? "off" : ""}"><i></i>${esc(syncLabel)}</span>
  </section>
  <div class="stat-grid" style="margin-top:18px">
    <div class="stat"><b>${sDone}/${story.length}</b><span>Story steps</span></div>
    <div class="stat"><b>${uDone}/${uniques.length}</b><span>Unique rewards found</span></div>
    <div class="stat"><b>${miss.filter((a) => isResolved(a.id)).length}/${miss.length}</b><span>Missables handled</span></div>
    <div class="stat"><b style="color:${mMissed ? "var(--danger)" : "inherit"}">${mMissed}</b><span>Missed</span></div>
  </div>
  <div class="progress-cols"><div>
  <section class="section"><h2 class="section-title">Chapters</h2><div class="chap-rows">${CHAPTERS.map((c) => {
    const s = chapterStats(c.id);
    return `<button class="chap-row" data-action="chapter-go" data-ch="${c.id}">${thumbHTML(c.id, true)}<span class="ttl"><span class="eyebrow">${c.number === 0 ? "Prologue" : c.postGame ? "Post-game" : "Chapter " + c.number}</span><b>${esc(c.title)}</b></span><span class="pct">${s.pct}%</span><span class="bar"><i style="width:${s.pct}%"></i></span></button>`;
  }).join("")}</div></section>
  </div><div>
  <section class="section"><h2 class="section-title">Settings</h2>
    <div class="panel">
      <h3>Pace</h3><p class="small muted">Decides which priorities “What should I do next?” suggests. The story and urgent missables always show.</p>
      <div class="pace" role="group" aria-label="Choose your pace">${Object.entries(PACES).map(([k, p]) => `<button data-action="pace" data-pace="${k}" aria-pressed="${k === S.prefs.pace}">${esc(p.label)}</button>`).join("")}</div>
    </div>
    <div class="panel">
      <h3>Story mission names</h3><p class="small muted">Mission titles can hint at the plot. By default, names ahead of your current chapter stay hidden.</p>
      <div class="toggles"><button class="tog" data-action="names" data-v="current" aria-pressed="${S.prefs.names !== "always"}">Hide names ahead of me</button><button class="tog" data-action="names" data-v="always" aria-pressed="${S.prefs.names === "always"}">Always show names</button></div>
    </div>
    <div class="panel">
      <h3>Already playing?</h3><p class="small muted">Jump to where you are. This marks every story mission before your pick as done. Side content is left alone.</p>
      <label class="small muted" for="cu-ch">Chapter</label>
      <select id="cu-ch" class="sel">${CHAPTERS.filter((c) => !c.postGame).map((c) => `<option value="${c.id}" ${c.id === (UI.cuCh || CHAPTERS[currentChapterIdx()].id) ? "selected" : ""}>${esc(c.number === 0 ? "Prologue" : "Chapter " + c.number + ": " + c.title)}</option>`).join("")}</select>
      <label class="small muted" for="cu-m">The mission you're about to play</label>
      <select id="cu-m" class="sel">${ORDERED.filter((a) => a.category === "story" && a.chapter === (UI.cuCh || CHAPTERS[currentChapterIdx()].id)).map((a) => `<option value="${esc(a.id)}">${esc(a.missionName)}</option>`).join("")}</select>
      <div class="actions"><button class="btn btn-sm" data-action="catch-up">Mark earlier story missions done</button></div>
    </div>
  </section>
  <section class="section"><h2 class="section-title">Backup and transfer</h2>
    <div class="panel">
      <p class="small muted">Progress saves on this device automatically${Sync.mode === "on" ? " and syncs to your other devices when you open this page signed in" : ""}. Export a JSON file as a backup, or to move progress somewhere else. Progress is keyed by stable step ids, so guide updates won't erase it.</p>
      <div class="actions"><button class="btn btn-sm" data-action="export">Export progress</button><button class="btn btn-sm" data-action="import">Import progress</button><button class="btn btn-sm btn-danger" data-action="reset-all">Reset all progress</button></div>
    </div>
  </section>
  </div></div>
  <section class="section"><h2 class="section-title">Research status</h2>
    <div class="panel"><h3>How to read the badges</h3><div class="legend">
      <span>${verifBadge({ verificationStatus: "verified" }, true)} · ${esc(DATA.meta.verificationLegend.verified)}</span>
      <span>${verifBadge({ verificationStatus: "community" }, true)} · ${esc(DATA.meta.verificationLegend.community)}</span>
      <span>${verifBadge({ verificationStatus: "unconfirmed" }, true)} · ${esc(DATA.meta.verificationLegend.unconfirmed)}</span>
    </div><p class="small muted">Counts: ${["verified", "community", "unconfirmed"].map((v) => `${all.filter((a) => a.verificationStatus === v).length} ${v}`).join(" · ")}. Data version ${esc(DATA.meta.dataVersion)}, last updated ${esc(DATA.meta.lastUpdated)}.</p></div>
    <div class="panel"><h3>Known research gaps</h3><ul class="gaps">${DATA.researchGaps.map((g) => `<li><b>${esc(g.area)}.</b> ${esc(g.detail)}</li>`).join("")}</ul></div>
    <div class="panel"><details class="more"><summary>All sources (${Object.keys(DATA.sources).length})</summary><div><ul class="sources">${Object.values(DATA.sources).map((s) => `<li>${/^https?:/.test(s.url) ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>` : esc(s.name)}${s.published ? ` (${esc(s.published)})` : ""}</li>`).join("")}</ul></div></details></div>
  </section>`;
  h += footHTML() + `</div>`;
  return h;
}

function footHTML() {
  return `<footer class="foot"><p>${esc(DATA.meta.disclaimer)} Data ${esc(DATA.meta.dataVersion)}. Chapter photographs from Wikimedia Commons, used under their licences.</p><p><button class="btn btn-sm btn-ghost" data-action="credits">Photo credits</button></p></footer>`;
}

/* ═════════════ Sheets ═════════════ */
function openSheet(html) {
  const existing = $("#sheetRoot .sheet");
  if (existing) { const top = existing.scrollTop; existing.innerHTML = '<div class="grabber"></div>' + html; existing.scrollTop = top; return; }
  $("#sheetRoot").innerHTML = `<div class="scrim" data-action="close-sheet"><div class="sheet" role="dialog" aria-modal="true" data-stop>${'<div class="grabber"></div>' + html}</div></div>`;
  const first = $("#sheetRoot .sheet button, #sheetRoot .sheet textarea");
  if (first) first.focus({ preventScroll: true });
}
function closeSheet() { $("#sheetRoot").innerHTML = ""; }

function creditsSheet() {
  openSheet(`<h3>Photo credits</h3>
    <ul class="sources credits">${PHOTO_CREDITS.map(([ch, by, lic, url]) => `<li><span class="eyebrow">${esc(ch)}</span><a href="${esc(url)}" target="_blank" rel="noopener">${esc(by)}</a> · ${esc(lic)}</li>`).join("")}</ul>
    <div class="sheet-actions"><button class="btn btn-primary" data-action="close-sheet-btn">Close</button></div>`);
}
function filtersSheet() {
  const f = UI.filters;
  const tog = (group, val, label, pressed) => `<button class="tog" data-action="ftog" data-g="${group}" data-v="${val}" aria-pressed="${pressed}">${esc(label)}</button>`;
  openSheet(`<h3>Filter the journal</h3>
    <div class="fgroup"><span class="eyebrow">Priority</span><div class="toggles">
      ${tog("pri", "story", "Main story", f.pri.includes("story"))}
      ${Object.entries(DATA.taxonomy.priorities).map(([k, p]) => tog("pri", k, p.label, f.pri.includes(k))).join("")}
    </div></div>
    <div class="fgroup"><span class="eyebrow">Activity type</span><div class="toggles">${Object.entries(DATA.taxonomy.categories).map(([k, v]) => tog("cat", k, v, f.cat.includes(k))).join("")}</div></div>
    <div class="fgroup"><span class="eyebrow">Status</span><div class="toggles">${[["all", "Any"], ["todo", "To do"], ["done", "Done"], ["deferred", "Later"], ["skipped", "Skipped"], ["missed", "Missed"]].map(([k, v]) => tog("status", k, v, f.status === k)).join("")}</div></div>
    <div class="fgroup"><span class="eyebrow">Only show</span><div class="toggles">${tog("missable", "1", "Missable", f.missable)}${tog("available", "1", "Available now", f.available)}</div></div>
    <div class="fgroup"><span class="eyebrow">Character</span><div class="toggles">${[["any", "Anyone"], ["Jason", "Jason"], ["Lucia", "Lucia"]].map(([k, v]) => tog("character", k, v, f.character === k)).join("")}</div></div>
    <div class="fgroup"><span class="eyebrow">Research status</span><div class="toggles">${[["any", "Any"], ["verified", "Verified"], ["community", "Community-reported"], ["unconfirmed", "Unconfirmed"]].map(([k, v]) => tog("verif", k, v, f.verif === k)).join("")}</div></div>
    <div class="sheet-actions"><button class="btn btn-ghost" data-action="reset-filters">Clear all</button><button class="btn btn-primary" data-action="close-sheet-btn">Show results</button></div>`);
}

async function exportProgress() {
  const payload = { format: "completionist-journey-progress", version: 1, exportedAt: new Date().toISOString(), dataVersion: DATA.meta.dataVersion, state: S };
  const text = JSON.stringify(payload, null, 2);
  const filename = `completionist-journey-progress-${new Date().toISOString().slice(0, 10)}.json`;
  let dl = null;
  try { dl = window.claude && typeof window.claude.use === "function" ? await window.claude.use("downloads") : null; } catch { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data: text }); showToast("Progress exported"); return; }
    catch (e) { if (e && e.code === "declined") { showToast("Export cancelled"); return; } }
  }
  if (!window.claude) {
    try {
      const url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
      const link = document.createElement("a"); link.href = url; link.download = filename; document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      showToast("Progress exported"); return;
    } catch { /* fall through to copy */ }
  }
  openSheet(`<h3>Export progress</h3><p class="small muted">Copy this text and keep it somewhere safe. Paste it into Import to restore.</p>
    <textarea class="io" id="io-out" readonly>${esc(text)}</textarea>
    <div class="sheet-actions"><button class="btn" data-action="close-sheet-btn">Close</button><button class="btn btn-primary" data-action="copy-export">Copy</button></div>`);
}
function importSheet() {
  openSheet(`<h3>Import progress</h3><p class="small muted">Choose an exported .json file, or paste its contents. Importing replaces your current progress on this device${Sync.mode === "on" ? " and your synced devices" : ""}.</p>
    <input type="file" id="io-file" accept=".json,application/json" class="small">
    <textarea class="io" id="io-in" placeholder="…or paste exported JSON here"></textarea>
    <p class="small" id="io-msg" style="color:var(--danger)"></p>
    <div class="sheet-actions"><button class="btn" data-action="close-sheet-btn">Cancel</button><button class="btn btn-primary" data-action="do-import">Replace my progress</button></div>`);
}
function doImport() {
  const raw = ($("#io-in") || {}).value || "";
  const msg = $("#io-msg");
  let parsed;
  try { parsed = JSON.parse(raw); } catch { msg.textContent = "That isn't valid JSON. Paste the full exported file."; return; }
  const st = parsed && parsed.format === "completionist-journey-progress" ? parsed.state : parsed;
  if (!st || typeof st !== "object" || !st.items) { msg.textContent = "This doesn't look like an exported progress file."; return; }
  const incoming = normalize(st);
  const t = now();
  for (const b of ["items", "hints", "names"]) for (const k of Object.keys(incoming[b])) incoming[b][k] = Object.assign({}, incoming[b][k], { t });
  // Entries present now but absent from the file become to-do, so a replace really replaces.
  for (const k of Object.keys(S.items)) if (!incoming.items[k]) incoming.items[k] = { s: "todo", t };
  for (const k of Object.keys(S.hints)) if (!incoming.hints[k]) incoming.hints[k] = { l: 0, t };
  incoming.prefsT = t;
  S = incoming; migrateIds(); persist(); closeSheet(); render();
  const n = Object.values(S.items).filter((x) => x.s === "done").length;
  showToast(`Imported · ${n} steps done`);
}
function resetSheet() {
  openSheet(`<h3>Reset all progress?</h3><p class="muted">Every checkmark, skipped step, saved-for-later item and revealed hint goes back to the start${Sync.mode === "on" ? ", on every synced device" : ""}. Export first if you might want it back.</p>
    <div class="sheet-actions"><button class="btn" data-action="close-sheet-btn">Keep my progress</button><button class="btn btn-danger" data-action="do-reset">Reset everything</button></div>`);
}
function doReset() {
  const t = now();
  for (const k of Object.keys(S.items)) S.items[k] = { s: "todo", t };
  for (const k of Object.keys(S.hints)) S.hints[k] = { l: 0, t };
  for (const k of Object.keys(S.names)) S.names[k] = { r: 0, t };
  persist(); closeSheet(); render(); showToast("Progress reset");
}
function catchUp() {
  const id = ($("#cu-m") || {}).value;
  const target = BY_ID.get(id); if (!target) return;
  const t = now(); let n = 0;
  for (const a of ORDERED) {
    if (a === target) break;
    if (a.category === "story" && stored(a.id) !== "done") { S.items[a.id] = { s: "done", t }; n++; }
  }
  persist(); UI.chapter = null; render();
  showToast(`${n} story mission${n === 1 ? "" : "s"} marked done`);
}

/* ═════════════ Render root ═════════════ */
function renderChrome() {
  if (!DATA) return;
  const o = overallStats();
  const C = 2 * Math.PI * 18;
  $("#ring").innerHTML = `<svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="18" fill="none" stroke="var(--surface-3)" stroke-width="4"/><circle cx="22" cy="22" r="18" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - o.pct / 100)}"/></svg><span>${o.pct}%</span>`;
  $("#ring").setAttribute("aria-label", `Overall completion ${o.pct}%`);
  const openMiss = ACTS.filter((a) => a.missable && chapterIdx(a) <= currentChapterIdx() && statusOf(a) === "todo").length;
  const tabs = [["now", "Now", ICON.tabNow, 0], ["journal", "Journal", ICON.tabJournal, 0], ["missables", "Missables", ICON.tabMiss, openMiss], ["progress", "Progress", ICON.tabProgress, 0]];
  const html = tabs.map(([k, l, ic, b]) => `<button class="tab" data-action="nav" data-view="${k}" ${UI.view === k ? 'aria-current="page"' : ""}>${ic}<span>${l}</span>${b ? `<span class="badge">${b}</span>` : ""}</button>`).join("");
  $("#tabs").innerHTML = html;
  $("#deskTabs").innerHTML = html;
  const sync = $(".sync");
  if (sync && UI.view === "progress") { /* progress view re-renders its own label on full render */ }
}
function render() {
  if (!DATA) return;
  const y = window.scrollY;
  const focusId = document.activeElement && document.activeElement.id;
  const selStart = focusId === "q" ? document.activeElement.selectionStart : null;
  const v = UI.view;
  $("#view").innerHTML = v === "journal" ? viewJournal() : v === "missables" ? viewMissables() : v === "progress" ? viewProgress() : viewNow();
  renderChrome();
  window.scrollTo(0, y);
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus({ preventScroll: true }); if (selStart != null && el.setSelectionRange) el.setSelectionRange(selStart, selStart); } }
}
function navigate(view, { scrollTop = true } = {}) {
  UI.view = view;
  if (location.hash.slice(1) !== view) history.replaceState(null, "", "#" + view);
  render();
  if (scrollTop) window.scrollTo(0, 0);
}
function gotoCard(id) {
  const a = BY_ID.get(id); if (!a) return;
  const target = a.duringMission ? BY_ID.get(a.duringMission) : a;
  UI.q = ""; UI.chapter = target.chapter; UI.expanded.add(target.id); if (a !== target) UI.expanded.add(a.id);
  UI.view = "journal"; history.replaceState(null, "", "#journal");
  render();
  requestAnimationFrame(() => { const el = document.getElementById("card-" + id); if (el) el.scrollIntoView({ block: "center", behavior: "smooth" }); });
}

/* ═════════════ Events ═════════════ */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const act = el.dataset.action, id = el.dataset.id;
  if (act === "close-sheet") { if (e.target.closest("[data-stop]")) return; closeSheet(); return; }
  switch (act) {
    case "nav": navigate(el.dataset.view); break;
    case "toggle": toggleDone(id); break;
    case "status": setStatus(id, el.dataset.s); if (el.closest(".next")) UI.heroOpen = false; break;
    case "expand": UI.expanded.has(id) ? UI.expanded.delete(id) : UI.expanded.add(id); render(); break;
    case "hint": revealHint(id); break;
    case "hide-hints": hideHints(id); break;
    case "reveal-name": revealName(id); break;
    case "hero-toggle": UI.heroOpen = !UI.heroOpen; render(); break;
    case "pace": setPref("pace", el.dataset.pace); break;
    case "names": setPref("names", el.dataset.v); break;
    case "chapter": UI.chapter = el.dataset.ch; UI.q = ""; render(); window.scrollTo(0, 0); break;
    case "chapter-go": UI.chapter = el.dataset.ch; UI.q = ""; navigate("journal"); break;
    case "goto": closeSheet(); gotoCard(id); break;
    case "open-search": UI.view = "journal"; history.replaceState(null, "", "#journal"); render(); requestAnimationFrame(() => { const q = $("#q"); if (q) q.focus(); }); break;
    case "clear-search": UI.q = ""; render(); break;
    case "open-filters": filtersSheet(); break;
    case "credits": creditsSheet(); break;
    case "ftog": {
      const f = UI.filters, g = el.dataset.g, v = el.dataset.v;
      if (g === "pri" || g === "cat") { f[g] = f[g].includes(v) ? f[g].filter((x) => x !== v) : [...f[g], v]; }
      else if (g === "missable" || g === "available") f[g] = !f[g];
      else f[g] = v;
      saveUI(); render(); filtersSheet(); break;
    }
    case "reset-filters": UI.filters = defaultFilters(); saveUI(); render(); if ($("#sheetRoot").innerHTML) filtersSheet(); break;
    case "close-sheet-btn": closeSheet(); break;
    case "filter-open-earlier": UI.filters = Object.assign(defaultFilters(), { available: true }); UI.chapter = CHAPTERS[Math.max(0, currentChapterIdx() - 1)].id; saveUI(); navigate("journal"); break;
    case "filter-deferred": UI.filters = Object.assign(defaultFilters(), { status: "deferred" }); UI.q = ""; saveUI(); navigate("journal"); showToast("Showing items saved for later. Switch chapters to see others."); break;
    case "undo": if (showToast.undo) { const u = showToast.undo; showToast.undo = null; $("#toastRoot").innerHTML = ""; u(); } break;
    case "export": exportProgress(); break;
    case "import": importSheet(); break;
    case "do-import": doImport(); break;
    case "copy-export": {
      const ta = $("#io-out");
      const done = () => showToast("Copied");
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done).catch(() => { ta.select(); });
      else ta.select();
      break;
    }
    case "reset-all": resetSheet(); break;
    case "do-reset": doReset(); break;
    case "catch-up": catchUp(); break;
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "q") { UI.q = e.target.value; render(); }
  if (e.target.id === "io-in") { const m = $("#io-msg"); if (m) m.textContent = ""; }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "cu-ch") { UI.cuCh = e.target.value; render(); }
  if (e.target.id === "io-file" && e.target.files && e.target.files[0]) {
    const r = new FileReader();
    r.onload = () => { const ta = $("#io-in"); if (ta) ta.value = String(r.result || ""); };
    r.readAsText(e.target.files[0]);
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#sheetRoot").innerHTML) closeSheet(); });
window.addEventListener("hashchange", () => {
  const v = location.hash.slice(1);
  if (["now", "journal", "missables", "progress"].includes(v) && v !== UI.view) navigate(v);
});

/* ═════════════ Boot ═════════════ */
async function boot() {
  const h = location.hash.slice(1);
  if (["now", "journal", "missables", "progress"].includes(h)) UI.view = h;
  try {
    const res = await fetch(DATA_URL, { cache: "no-cache" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    indexData(await res.json());
  } catch (err) {
    $("#view").innerHTML = `<div class="wrap error-box"><div class="panel"><h3>Couldn't load the walkthrough data</h3>
      <p class="small muted">The page reads its steps from <code>${DATA_URL}</code> and couldn't open it (${esc(err.message)}). If you opened index.html straight from disk, serve the folder instead, for example with <code>python3 -m http.server</code>, then open http://localhost:8000.</p></div></div>`;
    return;
  }
  loadLocal(); migrateIds();
  document.documentElement.classList.add("is-entering");
  render();
  setTimeout(() => document.documentElement.classList.remove("is-entering"), 1600);
  Sync.start();
}
boot();
})();
</script>
