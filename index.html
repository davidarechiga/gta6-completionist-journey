<title>The Completionist's Journey</title>
<meta name="description" content="An unofficial, spoiler-light completionist companion for Grand Theft Auto VI: what to do next, why now, and what you'd miss by advancing the story.">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#161c1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400..600&family=Figtree:wght@400..700&family=Martian+Mono:wght@400..500&display=swap">
<style>
/* Dealt (tasteskill): palette green-black-bone, type sora (Sora / Figtree + Martian Mono), radius soft, buttons solid, mark initial.
   Why the palette fits: Leonida at night is mangrove water and humid dark; a green-black ground with bone type and a
   sea-glass accent lets the chapter photographs carry the colour. Layout: one journal column on phones (thumb tab bar),
   a two-column "now" board and header tabs on desktop. */
:root {
  color-scheme: dark;
  --bg: #161c1a;
  --bg-deep: #111614;
  --surface: #1f2725;
  --surface-2: #26302d;
  --surface-3: #313c38;
  --line: rgba(227, 226, 218, 0.08);
  --line-strong: rgba(227, 226, 218, 0.16);
  --ink: #e3e2da;
  --ink-2: #c2c4bb;
  --ink-3: #a9afa7;
  --accent: #9fc7b8;
  --accent-hi: #b6d6ca;
  --accent-ink: #161c1a;
  --danger: #f0897a;
  --warn: #e4bf6e;
  --apricot: #eaa66f;
  --font-display: "Sora", "Avenir Next", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Martian Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r-xl: 20px;
  --r-lg: 16px;
  --r-md: 12px;
  --r-sm: 8px;
  --r-btn: 10px;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --dur: 180ms;
  --tabbar-h: 64px;
  --topbar-h: 64px;
  /* names the script uses inline */
  --night: var(--bg);
  --night-2: var(--surface);
  --night-3: var(--surface-2);
  --night-4: var(--surface-3);
  --teal: var(--accent);
  --sun: var(--warn);
}
* { box-sizing: border-box; }
html { background: var(--bg); overflow-x: clip; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
  font-feature-settings: "ss01";
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { color: var(--accent-hi); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
img { display: block; max-width: 100%; }
.eyebrow {
  font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-3);
}
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.skip { position: fixed; left: 12px; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 60; padding: 12px 16px; border-radius: 10px; background: var(--ink); color: var(--bg); font-weight: 700; text-decoration: none; transform: translateY(-160%); transition: transform var(--dur) var(--ease); }
.skip:focus, .skip:focus-visible { transform: none; color: var(--bg); }

/* ── Header ── */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 84%, transparent);
  backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%);
  border-bottom: 1px solid var(--line);
}
.topbar-inner { display: flex; align-items: center; gap: 12px; min-height: var(--topbar-h); padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.mark--initial {
  width: 32px; height: 32px; flex: none; border-radius: 9px; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink); font: 600 17px/1 var(--font-display); letter-spacing: -0.02em;
}
.brand-text { display: flex; flex-direction: column; min-width: 0; gap: 2px; }
.brand-name { font-family: var(--font-display); font-weight: 500; font-size: 15.5px; letter-spacing: -0.015em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 479px) {
  .brand-name { white-space: normal; font-size: 15px; line-height: 1.12; }
  .brand-sub { display: none; }
}
.ring { position: relative; width: 44px; height: 44px; flex: none; }
.ring svg { width: 44px; height: 44px; transform: rotate(-90deg); }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-mono); font-size: 10px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); display: grid; place-items: center; flex: none;
  transition: transform var(--dur) var(--ease), background-color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.icon-btn svg { width: 20px; height: 20px; }
.desk-tabs { display: none; gap: 2px; }

/* ── Tab bar ── */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: color-mix(in srgb, var(--bg-deep) 92%, transparent);
  backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tabbar-inner { display: grid; grid-template-columns: repeat(4, 1fr); max-width: 760px; margin: 0 auto; }
.tab {
  height: var(--tabbar-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  background: none; border: 0; color: var(--ink-3); font-size: 11.5px; font-weight: 600; letter-spacing: .01em; position: relative;
  transition: color var(--dur) var(--ease);
}
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] svg { color: var(--accent); }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: calc(50% - 14px); width: 28px; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.tab .badge { position: absolute; top: 8px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #22100c; font-family: var(--font-mono); font-size: 10px; font-weight: 500; display: grid; place-items: center; }
main { padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 28px); }

@media (min-width: 900px) {
  .tabbar { display: none; }
  .desk-tabs { display: flex; }
  .desk-tabs .tab { height: 44px; flex-direction: row; padding: 0 14px; font-size: 14.5px; gap: 8px; color: var(--ink-2); }
  .desk-tabs .tab svg { width: 18px; height: 18px; }
  .desk-tabs .tab::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 5px; height: 2px; border-radius: 1px; background: var(--ink-3); transform: scaleX(0); transform-origin: left; transition: transform .28s var(--ease); }
  .desk-tabs .tab:hover { color: var(--ink); }
  .desk-tabs .tab:hover::after { transform: scaleX(1); }
  .desk-tabs .tab[aria-current="page"] { color: var(--ink); }
  .desk-tabs .tab[aria-current="page"]::after { transform: scaleX(1); background: var(--accent); }
  .desk-tabs .tab[aria-current="page"]::before { display: none; }
  .desk-tabs .tab .badge { position: static; }
  .wrap { max-width: 1200px; }
  main { padding-bottom: 56px; }
}

@media (min-width: 1232px) { .wrap { padding-left: 0; padding-right: 0; } }

/* ── Generic bits ── */
.section { display: flex; flex-direction: column; gap: 12px; margin-top: 32px; }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; }
.section-head .eyebrow { white-space: nowrap; }
.section-title { font-family: var(--font-display); font-size: 21px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.2; }
.muted { color: var(--ink-3); }
.small { font-size: 13.5px; }
.btn {
  min-height: 44px; padding: 0 16px; border-radius: var(--r-btn); border: 1px solid var(--line-strong); background: var(--surface-2);
  font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; color: var(--ink);
  transition: transform var(--dur) var(--ease), background-color var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.btn svg { width: 18px; height: 18px; }
.btn:active, .icon-btn:active { transform: translateY(0) scale(.97); }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn-ghost { background: transparent; }
.btn-danger { border-color: color-mix(in srgb, var(--danger) 55%, transparent); color: var(--danger); background: transparent; }
.btn-sm { min-height: 40px; padding: 0 14px; font-size: 14px; }
@media (max-width: 899px) { .btn-sm { min-height: 44px; } }
@media (hover: hover) {
  .btn:hover, .icon-btn:hover { transform: translateY(-1px); background: var(--surface-3); border-color: rgba(227, 226, 218, .26); }
  .btn-primary:hover { background: var(--accent-hi); border-color: transparent; }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-danger:hover { background: color-mix(in srgb, var(--danger) 10%, transparent); border-color: var(--danger); }
  .btn:active, .icon-btn:active { transform: translateY(0) scale(.97); }
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 6px;
  font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap;
}
.chip svg { width: 13px; height: 13px; }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.p-essential { color: var(--apricot); }
.chip.p-recommended { color: var(--ink); }
.chip.p-explore { color: var(--accent); }
.chip.p-cleanup { color: var(--ink-3); }
.chip.miss { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); background: color-mix(in srgb, var(--danger) 10%, var(--surface)); }
.chip.timed { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 9%, var(--surface)); }
.chip.teaser { color: var(--ink); background: color-mix(in srgb, var(--accent) 12%, var(--surface-2)); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.chip.teaser svg { color: var(--accent); }
.chip.teaser.plain { background: var(--surface-2); border-color: var(--line); color: var(--ink-2); }
.chip.st-deferred { color: var(--warn); }
.chip.st-skipped { color: var(--ink-3); }
.chip.st-missed { color: var(--danger); }
.chip.st-locked { color: var(--ink-3); }
.verif { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-3); }
.verif svg { width: 13px; height: 13px; }
.verif.v-verified { color: var(--accent); }
.verif.v-community { color: var(--warn); }
.verif.v-unconfirmed { color: var(--ink-3); }

/* ── Cards ── */
.list { display: flex; flex-direction: column; gap: 8px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); position: relative;
  transition: transform var(--dur) var(--ease), border-color var(--dur) var(--ease), background-color var(--dur) var(--ease);
}
.card.is-open { border-color: var(--line-strong); background: color-mix(in srgb, var(--surface-2) 55%, var(--surface)); }
@media (hover: hover) { .card:not(.is-open):hover { transform: translateY(-2px); border-color: var(--line-strong); } }
.card-row { display: grid; grid-template-columns: 56px minmax(0, 1fr); align-items: start; }
.check {
  width: 44px; height: 44px; margin: 10px 0 10px 10px; border-radius: 50%; border: 2px solid var(--line-strong); background: transparent;
  display: grid; place-items: center; color: transparent; transition: background-color .15s, border-color .15s, color .15s, transform .12s var(--ease);
}
.check svg { width: 20px; height: 20px; }
@media (hover: hover) { .card:not(.s-done) .check:hover { border-color: var(--accent); color: color-mix(in srgb, var(--accent) 55%, transparent); } }
.check:active { transform: scale(.9); }
.card.s-done .check { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.card.s-skipped .check { border-style: dashed; color: var(--ink-3); }
.card.s-deferred .check { border-color: var(--warn); color: var(--warn); }
.card.s-missed .check { border-color: var(--danger); color: var(--danger); }
.card-main { padding: 13px 16px 13px 6px; min-width: 0; background: none; border: 0; text-align: left; display: flex; flex-direction: column; gap: 6px; width: 100%; }
.card-eyebrow { font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-title { font-size: 16.5px; font-weight: 600; line-height: 1.3; letter-spacing: -0.005em; }
.card.s-done .card-title, .card.s-skipped .card-title { color: var(--ink-3); }
.card.s-done .card-title { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--accent) 55%, transparent); text-decoration-thickness: 1.5px; }
.card.cat-story { box-shadow: inset 3px 0 0 var(--accent); }
.card.cat-story .card-title { font-family: var(--font-display); font-size: 18px; font-weight: 500; letter-spacing: -0.02em; }
.card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 14px; border-top: 1px solid var(--line); margin-top: 2px; }
.card-body .desc { color: var(--ink-2); }
.why { color: var(--ink-2); font-size: 15px; }
.why b { color: var(--ink); font-weight: 600; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 16px; font-size: 14px; margin: 0; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; color: var(--ink-2); min-width: 0; }
.unlocks { margin: 4px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.name-reveal { background: none; border: 0; padding: 0; color: var(--accent); font-size: 13.5px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; min-height: 32px; }

.missbox { border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent); background: color-mix(in srgb, var(--danger) 8%, var(--surface)); border-radius: var(--r-md); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.missbox.temporary { border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 7%, var(--surface)); }
.missbox-head { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--danger); font-size: 14px; }
.missbox.temporary .missbox-head { color: var(--warn); }
.missbox-head svg { width: 18px; height: 18px; flex: none; }

.during { border: 1px dashed var(--line-strong); border-radius: var(--r-md); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.during .card { background: var(--bg); }

/* Hints */
.hints { border-radius: var(--r-md); background: var(--bg-deep); border: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.hints-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.hint-steps { display: flex; gap: 4px; }
.hint-steps i { width: 22px; height: 4px; border-radius: 2px; background: var(--surface-3); display: block; transition: background-color .3s var(--ease); }
.hint-steps i.on { background: var(--accent); }
.hint { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; animation: rise .3s var(--ease) both; }
.hint-n { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-family: var(--font-mono); font-size: 11px; font-weight: 500; background: var(--surface-2); color: var(--ink-2); }
.hint.l4 .hint-n { background: var(--accent); color: var(--accent-ink); }
.hint-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); display: block; margin-bottom: 2px; }
.hint p { color: var(--ink); font-size: 15px; }
.hint-locked { color: var(--ink-3); font-size: 14px; }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.sources { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-3); display: flex; flex-direction: column; gap: 4px; }
.sources a { overflow-wrap: anywhere; }
.sources.credits { list-style: none; padding: 0; gap: 12px; font-size: 15px; color: var(--ink-2); }
.sources.credits li { display: flex; flex-direction: column; gap: 2px; }
.foot .btn { color: var(--ink-2); font-weight: 600; }
details.more > summary { cursor: pointer; color: var(--ink-3); font-size: 13.5px; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 8px; min-height: 36px; transition: color var(--dur) var(--ease); }
details.more > summary:hover { color: var(--ink); }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "+"; display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; border: 1px solid var(--line-strong); font-size: 13px; }
details.more[open] > summary::before { content: "–"; }
details.more > div { display: flex; flex-direction: column; gap: 10px; padding-top: 8px; }

/* ── Chapter banner (the setting, full bleed; enters once on load) ── */
.banner-hero { --bh: clamp(210px, 58vw, 290px); position: relative; isolation: isolate; min-height: var(--bh); padding-top: calc(var(--bh) - 108px); }
.banner { position: absolute; z-index: 0; top: 0; left: 0; right: 0; height: var(--bh); overflow: hidden; display: block; }
.banner-hero > .wrap { position: relative; z-index: 1; }
.banner img {
  width: 100%; height: 100%; object-fit: cover; filter: brightness(.86) saturate(1.04);
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 34%, rgba(0, 0, 0, .42) 66%, rgba(0, 0, 0, .1) 86%, transparent 100%);
  mask-image: linear-gradient(to bottom, #000 0%, #000 34%, rgba(0, 0, 0, .42) 66%, rgba(0, 0, 0, .1) 86%, transparent 100%);
}
@media (min-width: 900px) {
  .banner-hero { --bh: 380px; padding-top: 226px; }
  .banner { max-width: 1600px; margin: 0 auto; }
  .banner img {
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 30%, rgba(0, 0, 0, .4) 64%, rgba(0, 0, 0, .08) 86%, transparent 100%), linear-gradient(to right, transparent 0%, #000 14%, #000 86%, transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(to bottom, #000 0%, #000 30%, rgba(0, 0, 0, .4) 64%, rgba(0, 0, 0, .08) 86%, transparent 100%), linear-gradient(to right, transparent 0%, #000 14%, #000 86%, transparent 100%);
    mask-composite: intersect;
  }
}
html.is-entering [data-enter] .banner img { animation: banner-in 1.2s var(--ease) both; }
html.is-entering .chapter-hero.on-banner > * { animation: rise-in .8s var(--ease) both; }
html.is-entering .chapter-hero.on-banner > :nth-child(2) { animation-delay: .08s; }
html.is-entering .chapter-hero.on-banner > :nth-child(3) { animation-delay: .16s; }
@keyframes banner-in { from { opacity: 0; transform: scale(1.06); } to { opacity: 1; transform: none; } }
@keyframes rise-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ── Now view ── */
.chapter-hero { padding-top: 28px; display: flex; flex-direction: column; gap: 8px; position: relative; }
.chapter-hero h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(34px, 8.6vw, 64px); line-height: 1.02; letter-spacing: -0.04em; color: var(--ink); }
.chapter-hero .intro { color: var(--ink-2); max-width: 62ch; }
.chapter-hero.on-banner { padding-top: 0; }
.chapter-hero.on-banner .eyebrow { color: var(--ink); text-shadow: 0 1px 14px rgba(0, 0, 0, .55); }
.chapter-hero.on-banner h1 { text-shadow: 0 2px 24px rgba(0, 0, 0, .35); }
.progress-line { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }

/* ═════════════ Helpers ═════════════ */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (sel, root = document) => root.querySelector(sel);
const photoOf = (chId) => PHOTOS[chId] || PHOTOS.post;
function photoFile(p, w) {
  const max = p.w[p.w.length - 1];

}
function bannerHTML(chId) {
  const p = photoOf(chId);

  return `<picture class="banner"><img src="${photoFile(p, 960)}" srcset="${srcset}" sizes="(min-width: 900px) min(100vw, 1600px), 100vw" width="1280" height="853" alt="${esc(p.alt)}" style="object-position:${p.pos}" fetchpriority="high" data-source="stand-in" data-subject="stand-in"></picture>`;
}
function thumbHTML(chId, lazy) {
